titulo: 'Aula 24 - Variáveis aleatórias multidimensionais: distribuições conjuntas'
data: ''
resumo: Distribuição conjunta de duas variáveis aleatórias discretas; distribuições
  marginais e condicionais
bloco: 3
slides:
  titulo: Slides da aula 24
  arquivo: Aula_24_VA_Multidimensionais_Distribuicoes_Conjuntas.pptx
  arquivo_pdf: Aula_24_VA_Multidimensionais_Distribuicoes_Conjuntas.pdf
referencias_bibliograficas:
- livro: Bussab & Morettin, Estatística Básica, 9ª ed.
  citacao: Cap. 8 – 8.1, 8.2
- livro: Montgomery & Runger, Applied Statistics and Probability for Engineers, 7ª
    ed.
  citacao: Cap. 5 – 5.1, 5.2
- livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
  citacao: Cap. 5 – 5.1, 5.2
- livro: 'Morettin, Estatística Básica: Probabilidade e Inferência'
  citacao: Cap. 3 – 3.4
pre_aula:
  videos:
  - titulo: 'Aula 14: Variáveis Aleatórias Multidimensionais'
    url: https://www.youtube.com/watch?v=k5A-wUXi9dQ
exercicios_recomendados:
  itens:
  - livro: Bussab & Morettin, Estatística Básica, 9ª ed.
    exercicios: 'Cap. 8: Problemas 1, 2 e 3'
    recomendacao: 'Sequência muito didática: o problema 1 parte de um experimento
      simples (moeda + dado) para você mesmo montar a tabela conjunta; o 2 e o 3 já
      dão a tabela pronta e pedem marginais, condicionais e independência.'
  - livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
    exercicios: 'Cap. 5 (5.3 Exercícios): 25, 27, 28, 29 e 30'
    recomendacao: 'Boa variedade de contextos (paleontologia, matérias-primas, variáveis
      abstratas A e B). O exercício 30 é interessante: dá probabilidades condicionais
      e marginais parciais, e você precisa completar a tabela toda.'
  - livro: Montgomery & Runger, Applied Statistics and Probability for Engineers,
      7ª ed.
    exercicios: 'Cap. 5: Exercícios 5.1.1, 5.1.2, 5.2.1, 5.2.2, 5.2.4 e 5.2.5'
    recomendacao: Única referência desta lista com exemplos de variáveis contínuas
      bidimensionais (5.2.1 e 5.2.5, com densidades condicionais) — as outras referências
      desta lista trabalham só com variáveis discretas.
  - livro: 'Morettin, Estatística Básica: Probabilidade e Inferência'
    exercicios: 'Cap. 3: Exercícios 14, 15, 16, 17 e 18'
    recomendacao: 'O exercício 18 é bom para revisão: dá a tabela conjunta incompleta
      (falta descobrir o valor de p) antes de calcular tudo o mais.'
  arquivo: Tabela_Referencias_Aula24.pdf
lista_ia:
  lista_arquivo: Lista_Aula24_Original.pdf
  gabarito_arquivo: Gabarito_Aula24_Original.pdf
