exercicios_recomendados:
  itens:
  - livro: Bussab & Morettin, Estatística Básica, 9ª ed.
    exercicios: 'Cap. 6: Problemas 22, 23 e 24'
    recomendacao: 'Poucos exercícios dedicados só a Poisson neste livro. O problema
      24 é interessante: pede para resolver o mesmo problema com binomial e com Poisson
      e comparar os resultados.'
  - livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
    exercicios: 'Cap. 3 (3.4 Exercícios): 20, 21, 22 e 23'
    recomendacao: Boa variedade de contextos (aeroporto, central de atendimento, processamento
      de dados, manutenção industrial).
  - livro: Montgomery & Runger, Applied Statistics and Probability for Engineers,
      7ª ed.
    exercicios: 'Cap. 3: Exercícios 3.8.1, 3.8.2, 3.8.3, 3.8.4, 3.8.5, 3.8.6 e 3.8.7'
    recomendacao: Referência mais completa para esta aula. O exercício 3.8.7 é um
      caso histórico famoso (mortes de soldados por coice de cavalo) — vale a pena
      resolver.
  - livro: 'Morettin, Estatística Básica: Probabilidade e Inferência'
    exercicios: 'Cap. 4: Exercícios 6, 9, 10 e 16'
    recomendacao: Bons exercícios práticos (emissão radioativa, pronto-socorro, estouro
      de pneus, defeitos em tecido).
  arquivo: Tabela_Referencias_Aula11.pdf
