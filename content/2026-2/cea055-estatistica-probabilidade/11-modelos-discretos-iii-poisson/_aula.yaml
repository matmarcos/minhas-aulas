pre_aula:
  leitura:
    itens:
    - Bussab & Morettin, Estatística Básica, 9ª ed. — Capítulo 6, seções 6.6.5 (Distribuição
      de Poisson) e 6.7 (O Processo de Poisson).
    - Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed. — Capítulo 3,
      seção 3.3 (Outros Modelos Discretos), trecho do Modelo Poisson (Definição 3.7).
    nota: As duas referências cobrem o mesmo conteúdo — basta ler uma.
  videos:
  - titulo: 'Aula 9: Distribuição de Poisson'
    url: https://www.youtube.com/watch?v=4b9ShYWAows
  tarefa:
  - Uma equipe de TI cuida do servidor de e-mail e da loja de aplicativos de uma empresa.
    Para cada situação, monte a expressão da probabilidade pedida — não precisa calcular
    o valor final.
  - (a) O filtro do servidor recebe, em média, 6 mensagens de spam por hora. Monte
    a expressão da probabilidade de chegarem exatamente 2 spams em uma hora.
  - (b) E em 20 minutos? Qual é o λ, e qual a expressão da probabilidade de não chegar
    nenhum spam?
  - (c) Um app tem 5.000 downloads por dia, e cada instalação falha com probabilidade
    0,0004. Qual modelo descreve exatamente o número de falhas no dia? Que modelo
    pode substituí-lo, e com qual λ? Monte a expressão de P(exatamente 1 falha) nos
    dois modelos.
  - Tarefa opcional, sem entrega e sem nota — serve para você conferir se entendeu
    a leitura. Tente antes de abrir o gabarito.
  gabarito:
  - titulo: (a) Spam por hora
    passos:
    - - Modelo
      - 'contamos ocorrências (spams) num intervalo de tempo, com taxa média conhecida
        e sem um número fixo de tentativas: Poisson.'
    - - Parâmetro
      - λ = 6 spams por hora.
    - - Conta
      - P(X = 2) = e⁻⁶ · 6² / 2! = 18 · e⁻⁶ ≈ 0,0446.
    - - Leitura
      - em cerca de 4,5% das horas chegam exatamente 2 spams — pouco, porque a média
        é 6.
  - titulo: (b) Spam em 20 minutos
    passos:
    - - Parâmetro
      - 'λ é proporcional ao tempo: 20 min = 1/3 de hora, então λ = 6 · 1/3 = 2.'
    - - Conta
      - P(X = 0) = e⁻² · 2⁰ / 0! = e⁻² ≈ 0,1353.
    - - Leitura
      - cerca de 13,5% dos intervalos de 20 minutos passam sem nenhum spam.
    - - Erro comum
      - 'usar λ = 6: a taxa precisa ser convertida para o intervalo pedido.'
  - titulo: (c) Falhas de instalação
    passos:
    - - Modelo exato
      - 'cada download é um ensaio com dois resultados (falha ou não), n = 5000 fixo,
        mesma p = 0,0004 e falhas independentes: binomial. P(X = 1) = C(5000,1) ·
        0,0004 · 0,9996⁴⁹⁹⁹ = 2 · 0,9996⁴⁹⁹⁹.'
    - - Aproximação
      - 'n grande e p pequeno: Poisson com λ = np = 5000 · 0,0004 = 2. P(X = 1) ≈
        e⁻² · 2¹ / 1! = 2e⁻².'
    - - Comparação
      - 'as duas dão ≈ 0,2707. Não é coincidência: 0,9996⁴⁹⁹⁹ ≈ e⁻², e é por isso
        que a aproximação funciona.'
    - - Erro comum
      - usar λ = 0,0004 ou λ = 5000. O λ é o número MÉDIO de falhas, np.
