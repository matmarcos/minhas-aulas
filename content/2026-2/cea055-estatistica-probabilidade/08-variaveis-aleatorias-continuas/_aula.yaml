pre_aula:
  leitura:
    itens:
    - Bussab & Morettin, Estatística Básica, 9ª ed. — Capítulo 7, seção 7.1 (variável
      aleatória contínua e função densidade).
    - Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed. — Capítulo 6,
      seção 6.1 (mesmo tema, segunda referência).
  videos:
  - titulo: 'Aula 5: Função de distribuição'
    url: https://www.youtube.com/watch?v=Nbq0DWW26ag
  - titulo: 'Aula 7: Valor esperado e variância (continuação)'
    url: https://www.youtube.com/watch?v=kXArrVxPcno
exercicios_recomendados:
  itens:
  - livro: Bussab & Morettin, Estatística Básica, 9ª ed.
    exercicios: 'Cap. 7: Problemas 1, 2, 4, 5, 6, 7, 9, 10, 11 e 12'
    recomendacao: Comece pelos problemas 1, 2 e 4 (verificar/ajustar uma densidade).
      Os problemas 5, 6, 7, 11 e 12 pedem esperança e variância; o 9 e o 10 são aplicações
      práticas (liga metálica, venda de arroz).
  - livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
    exercicios: 'Cap. 6 (6.3 Exercícios): 3, 4, 5, 6, 7, 8, 11 e 14'
    recomendacao: Boa variedade de contextos práticos (troca de amortecedor, praga
      agrícola, peso de recém-nascidos). Evite os exercícios 32 em diante da mesma
      lista — já são sobre o modelo Normal especificamente, conteúdo de uma aula futura.
  - livro: Montgomery & Runger, Applied Statistics and Probability for Engineers,
      7ª ed.
    exercicios: 'Cap. 4: Exercícios 4.2.1, 4.2.6, 4.2.8, 4.2.9, 4.3.1, 4.3.2, 4.3.6
      e 4.3.7'
    recomendacao: Os exercícios 4.2.x treinam a função de distribuição acumulada.
      Os 4.3.x calculam média e variância diretamente a partir da densidade.
  - livro: 'Morettin, Estatística Básica: Probabilidade e Inferência'
    exercicios: 'Cap. 5: Exercícios 1, 3, 4, 5, 6, 7, 9, 10 e 11'
    recomendacao: O exercício 1 é um bom aquecimento (envolve achar a constante K
      antes de calcular esperança e variância). O exercício 9 (duração de lâmpada)
      antecipa a distribuição exponencial, que você verá formalmente em breve.
  arquivo: Tabela_Referencias_Aula8.pdf
