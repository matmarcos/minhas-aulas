material_complementar:
  texto:
  - Para as contas, use a sua tabela normal P(0 ≤ Z ≤ z) (Aulas 13 e 15). Quando σ não é conhecido, a estatística passa
    a usar S e a tabela t — isso fica para a Aula 22.
