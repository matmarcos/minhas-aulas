titulo: 'Aula 23 - Variáveis aleatórias multidimensionais: distribuições conjuntas'
data: ''
resumo: Distribuição conjunta de duas variáveis aleatórias discretas; distribuições
  marginais e condicionais
bloco: 3
slides:
  titulo: Slides da aula 23
  arquivo: Aula_23_VA_Multidimensionais_Distribuicoes_Conjuntas.pptx
  arquivo_pdf: Aula_23_VA_Multidimensionais_Distribuicoes_Conjuntas.pdf
referencias_bibliograficas:
- livro: Bussab & Morettin, Estatística Básica, 9ª ed.
  citacao: Cap. 8 – 8.1, 8.2
- livro: Montgomery & Runger, Applied Statistics and Probability for Engineers, 7ª
    ed.
  citacao: Cap. 5 – 5.1, 5.2
- livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
  citacao: Cap. 5 – 5.1, 5.2
- livro: 'Morettin, Estatística Básica: Probabilidade e Inferência'
  citacao: Cap. 3 – 3.4
pre_aula:
  leitura:
    itens:
    - 'Bussab & Morettin, Estatística Básica, 9ª ed. — Seções 8.1 (distribuição conjunta) e 8.2 (distribuições marginais e condicionais; variáveis independentes).'
    - 'Montgomery & Runger, Estatística Aplicada e Probabilidade para Engenheiros, 7ª ed. — Seções 5.1 (distribuições conjuntas para duas variáveis; marginais) e 5.2 (distribuições condicionais e independência).'
    nota: 'As duas referências cobrem o mesmo conteúdo — basta ler uma. a aula trata só de variáveis discretas, com a distribuição conjunta numa tabela de dupla entrada. No Montgomery, pule as partes com densidade conjunta e integrais (caso contínuo). Na aula, a distribuição conjunta é escrita p(x, y) = P(X = x, Y = y), e as marginais, p_X(x) e p_Y(y).'
  videos:
  - titulo: 'Variáveis aleatórias multidimensionais (Prof. Francisco Rodrigues)'
    url: https://www.youtube.com/watch?v=k5A-wUXi9dQ
  - titulo: 'Distribuições marginais e condicionais (Khan Academy Brasil)'
    url: https://www.youtube.com/watch?v=v3zuHpP0fB4
  tarefa:
  - 'Uma queijaria de São Roque de Minas, na Serra da Canastra, entrega queijos a um empório de Belo Horizonte. Em cada entrega, observam-se duas variáveis: X = número de peças devolvidas pelo empório por defeito na casca (0, 1 ou 2) e Y = 1 se a entrega atrasou, 0 se chegou no prazo. Entregas que atrasam ficam mais tempo no caminhão, e a queijaria desconfia que atraso e devolução andam juntos. Pelo histórico, a distribuição conjunta de (X, Y) é:'
  - 'Distribuição conjunta de (X, Y) — X = 0: p(0, 0) = 0,45; p(0, 1) = 0,15 · X = 1: p(1, 0) = 0,15; p(1, 1) = 0,10 · X = 2: p(2, 0) = 0,05; p(2, 1) = 0,10'
  - '(a) Confira que a tabela é uma distribuição conjunta e complete as distribuições marginais de X e de Y.'
  - '(b) Qual é a probabilidade de uma entrega ter pelo menos uma peça devolvida? E de atrasar e ter pelo menos uma peça devolvida?'
  - '(c) Calcule P(Y = 1 | X = x) para x = 0, 1 e 2. O que acontece com a chance de atraso quando o número de peças devolvidas cresce?'
  - '(d) X e Y são independentes? Justifique com um par (x, y).'
  - '(e) Se X e Y fossem independentes, com as mesmas marginais, quanto deveriam valer p(0, 0) e p(2, 1)? Compare com os valores da tabela.'
  - 'Tarefa opcional, sem entrega e sem nota — serve para você conferir se entendeu a leitura. Tente antes de abrir o gabarito.'
  gabarito:
  - titulo: '(a) Conjunta e marginais'
    passos:
    - - 'Distribuição conjunta'
      - 'todos os valores são ≥ 0 e a soma das seis células é 0,45 + 0,15 + 0,15 + 0,10 + 0,05 + 0,10 = 1.'
    - - 'Marginal de X (soma das linhas)'
      - 'p_X(0) = 0,60; p_X(1) = 0,25; p_X(2) = 0,15.'
    - - 'Marginal de Y (soma das colunas)'
      - 'p_Y(0) = 0,65; p_Y(1) = 0,35. As duas marginais somam 1.'
  - titulo: '(b) Probabilidades de eventos'
    passos:
    - - 'Pelo menos uma devolvida'
      - 'P(X ≥ 1) = p_X(1) + p_X(2) = 0,25 + 0,15 = 0,40.'
    - - 'Atrasar e ter pelo menos uma devolvida'
      - 'soma das células com Y = 1 e X ≥ 1: p(1, 1) + p(2, 1) = 0,10 + 0,10 = 0,20.'
    - - 'Erro comum'
      - 'multiplicar P(X ≥ 1) × P(Y = 1) = 0,40 × 0,35 = 0,14. Isso só valeria se X e Y fossem independentes, e eles não são (item d).'
  - titulo: '(c) Distribuição condicional'
    passos:
    - - 'Conta'
      - 'P(Y = 1 | X = x) = p(x, 1)/p_X(x) — a probabilidade condicional da Aula 5, linha por linha.'
    - - 'Valores'
      - 'x = 0: 0,15/0,60 = 0,25; x = 1: 0,10/0,25 = 0,40; x = 2: 0,10/0,15 ≈ 0,67.'
    - - 'Interpretação'
      - 'a chance de atraso cresce com o número de peças devolvidas: 25%, 40% e cerca de 67%. Saber X muda a distribuição de Y.'
  - titulo: '(d) Independência'
    passos:
    - - 'Critério'
      - 'independência exige p(x, y) = p_X(x)·p_Y(y) para todo par; basta um par que falhe para concluir que não são independentes.'
    - - 'Par (0, 0)'
      - 'p(0, 0) = 0,45, mas p_X(0)·p_Y(0) = 0,60 × 0,65 = 0,39. Como 0,45 ≠ 0,39, X e Y não são independentes.'
    - - 'Mesma conclusão pelo item (c)'
      - 'P(Y = 1 | X = 0) = 0,25 é diferente de P(Y = 1) = 0,35.'
  - titulo: '(e) Como seria a tabela com independência'
    passos:
    - - 'Produto das marginais'
      - 'p(0, 0) = 0,60 × 0,65 = 0,39 e p(2, 1) = 0,15 × 0,35 = 0,0525.'
    - - 'Comparação'
      - 'na tabela real, p(0, 0) = 0,45 e p(2, 1) = 0,10 — as entregas "boas" (sem devolução e no prazo) e as "ruins" (duas devoluções e atraso) acontecem mais do que aconteceriam se as variáveis fossem independentes. É a dependência que a queijaria desconfiava.'
exercicios_recomendados:
  itens:
  - livro: Bussab & Morettin, Estatística Básica, 9ª ed.
    exercicios: 'Cap. 8: Problemas 1, 2 e 3'
    recomendacao: 'Sequência muito didática: o problema 1 parte de um experimento
      simples (moeda + dado) para você mesmo montar a tabela conjunta; o 2 e o 3 já
      dão a tabela pronta e pedem marginais, condicionais e independência.'
  - livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
    exercicios: 'Cap. 5 (5.3 Exercícios): 25, 27, 28, 29 e 30'
    recomendacao: 'Boa variedade de contextos (paleontologia, matérias-primas, variáveis
      abstratas A e B). O exercício 30 é interessante: dá probabilidades condicionais
      e marginais parciais, e você precisa completar a tabela toda.'
  - livro: Montgomery & Runger, Applied Statistics and Probability for Engineers,
      7ª ed.
    exercicios: 'Cap. 5: Exercícios 5.1.1, 5.1.2, 5.2.1, 5.2.2, 5.2.4 e 5.2.5'
    recomendacao: Única referência desta lista com exemplos de variáveis contínuas
      bidimensionais (5.2.1 e 5.2.5, com densidades condicionais) — as outras referências
      desta lista trabalham só com variáveis discretas.
  - livro: 'Morettin, Estatística Básica: Probabilidade e Inferência'
    exercicios: 'Cap. 3: Exercícios 14, 15, 16, 17 e 18'
    recomendacao: 'O exercício 18 é bom para revisão: dá a tabela conjunta incompleta
      (falta descobrir o valor de p) antes de calcular tudo o mais.'
  arquivo: Tabela_Referencias_Aula23.pdf
lista_ia:
  lista_arquivo: Lista_Aula23_Original.pdf
  gabarito_arquivo: Gabarito_Aula23_Original.pdf
