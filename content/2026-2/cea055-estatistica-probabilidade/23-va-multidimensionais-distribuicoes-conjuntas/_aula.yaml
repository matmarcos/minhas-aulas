titulo: 'Aula 23 - Variáveis aleatórias multidimensionais: distribuições conjuntas'
data: ''
resumo: Distribuição conjunta de duas variáveis aleatórias discretas; distribuições
  marginais e condicionais
bloco: 3
slides:
  titulo: Slides da aula 23
  arquivo: Aula_23_VA_Multidimensionais_Distribuicoes_Conjuntas_SITE.pptx
  arquivo_pdf: Aula_23_VA_Multidimensionais_Distribuicoes_Conjuntas_SITE.pdf
referencias_bibliograficas:
- livro: Bussab & Morettin, Estatística Básica, 9ª ed.
  citacao: Cap. 8 – 8.1, 8.2
- livro: Montgomery & Runger, Applied Statistics and Probability for Engineers, 7ª
    ed.
  citacao: Cap. 5 – 5.1, 5.2
- livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
  citacao: Cap. 5 – 5.1, 5.2
- livro: 'Morettin, Estatística Básica: Probabilidade e Inferência'
  citacao: Cap. 3 – 3.4
pre_aula:
  leitura:
    itens:
    - 'Bussab & Morettin, Estatística Básica, 9ª ed. — Seções 8.1 (distribuição conjunta) e 8.2 (distribuições marginais e condicionais; variáveis independentes).'
    - 'Montgomery & Runger, Estatística Aplicada e Probabilidade para Engenheiros, 7ª ed. — Seções 5.1 (distribuições conjuntas para duas variáveis; marginais) e 5.2 (distribuições condicionais e independência).'
    nota: 'As duas referências cobrem o mesmo conteúdo — basta ler uma. a aula trata só de variáveis discretas, com a distribuição conjunta numa tabela de dupla entrada. No Montgomery, pule as partes com densidade conjunta e integrais (caso contínuo). Na aula, a notação é a mesma das Aulas 5 e 7: P(X = x, Y = y) para a conjunta, P(X = x) e P(Y = y) para as marginais e P(Y = y | X = x) para a condicional.'
  videos:
  - titulo: 'Variáveis aleatórias multidimensionais (Prof. Francisco Rodrigues)'
    url: https://www.youtube.com/watch?v=k5A-wUXi9dQ
  - titulo: 'Distribuições marginais e condicionais (Khan Academy Brasil)'
    url: https://www.youtube.com/watch?v=v3zuHpP0fB4
  tarefa:
  - 'Uma queijaria de São Roque de Minas, na Serra da Canastra, entrega queijos a um empório de Belo Horizonte. Em cada entrega, observam-se duas variáveis: X = número de peças devolvidas pelo empório por defeito na casca (0, 1 ou 2) e Y = 1 se a entrega atrasou, 0 se chegou no prazo. Entregas que atrasam ficam mais tempo no caminhão, e a queijaria desconfia que atraso e devolução andam juntos. Pelo histórico, a distribuição conjunta de (X, Y) é:'
  - 'Distribuição conjunta de (X, Y) — X = 0: P(X = 0, Y = 0) = 0,45; P(X = 0, Y = 1) = 0,15 · X = 1: P(X = 1, Y = 0) = 0,15; P(X = 1, Y = 1) = 0,10 · X = 2: P(X = 2, Y = 0) = 0,05; P(X = 2, Y = 1) = 0,10'
  - '(a) Confira que a tabela é uma distribuição conjunta e complete as distribuições marginais de X e de Y.'
  - '(b) Qual é a probabilidade de uma entrega ter pelo menos uma peça devolvida? E de atrasar e ter pelo menos uma peça devolvida?'
  - '(c) Calcule P(Y = 1 | X = x) para x = 0, 1 e 2. O que acontece com a chance de atraso quando o número de peças devolvidas cresce?'
  - '(d) X e Y são independentes? Justifique com um par (x, y).'
  - '(e) Se X e Y fossem independentes, com as mesmas marginais, quanto deveriam valer P(X = 0, Y = 0) e P(X = 2, Y = 1)? Compare com os valores da tabela.'
  - 'Tarefa opcional, sem entrega e sem nota — serve para você conferir se entendeu a leitura. Tente antes de abrir o gabarito.'
  gabarito:
  - titulo: '(a) Conjunta e marginais'
    passos:
    - - 'Distribuição conjunta'
      - 'todos os valores são ≥ 0 e a soma das seis células é 0,45 + 0,15 + 0,15 + 0,10 + 0,05 + 0,10 = 1.'
    - - 'Marginal de X (soma das linhas)'
      - 'P(X = 0) = 0,60; P(X = 1) = 0,25; P(X = 2) = 0,15.'
    - - 'Marginal de Y (soma das colunas)'
      - 'P(Y = 0) = 0,65; P(Y = 1) = 0,35. As duas marginais somam 1.'
  - titulo: '(b) Probabilidades de eventos'
    passos:
    - - 'Pelo menos uma devolvida'
      - 'P(X ≥ 1) = P(X = 1) + P(X = 2) = 0,25 + 0,15 = 0,40.'
    - - 'Atrasar e ter pelo menos uma devolvida'
      - 'soma das células com Y = 1 e X ≥ 1: P(X = 1, Y = 1) + P(X = 2, Y = 1) = 0,10 + 0,10 = 0,20.'
    - - 'Erro comum'
      - 'multiplicar P(X ≥ 1) × P(Y = 1) = 0,40 × 0,35 = 0,14. Isso só valeria se X e Y fossem independentes, e eles não são (item d).'
  - titulo: '(c) Distribuição condicional'
    passos:
    - - 'Conta'
      - 'P(Y = 1 | X = x) = P(X = x, Y = 1)/P(X = x) — a probabilidade condicional da Aula 5, linha por linha.'
    - - 'Valores'
      - 'x = 0: 0,15/0,60 = 0,25; x = 1: 0,10/0,25 = 0,40; x = 2: 0,10/0,15 ≈ 0,67.'
    - - 'Interpretação'
      - 'a chance de atraso cresce com o número de peças devolvidas: 25%, 40% e cerca de 67%. Saber X muda a distribuição de Y.'
  - titulo: '(d) Independência'
    passos:
    - - 'Critério'
      - 'independência exige P(X = x, Y = y) = P(X = x)·P(Y = y) para todo par; basta um par que falhe para concluir que não são independentes.'
    - - 'Par (0, 0)'
      - 'P(X = 0, Y = 0) = 0,45, mas P(X = 0)·P(Y = 0) = 0,60 × 0,65 = 0,39. Como 0,45 ≠ 0,39, X e Y não são independentes.'
    - - 'Mesma conclusão pelo item (c)'
      - 'P(Y = 1 | X = 0) = 0,25 é diferente de P(Y = 1) = 0,35.'
  - titulo: '(e) Como seria a tabela com independência'
    passos:
    - - 'Produto das marginais'
      - 'P(X = 0, Y = 0) = 0,60 × 0,65 = 0,39 e P(X = 2, Y = 1) = 0,15 × 0,35 = 0,0525.'
    - - 'Comparação'
      - 'na tabela real, P(X = 0, Y = 0) = 0,45 e P(X = 2, Y = 1) = 0,10 — as entregas "boas" (sem devolução e no prazo) e as "ruins" (duas devoluções e atraso) acontecem mais do que aconteceriam se as variáveis fossem independentes. É a dependência que a queijaria desconfiava.'
exercicios_recomendados:
  itens:
  - livro: Bussab & Morettin, Estatística Básica, 9ª ed.
    exercicios: 'Cap. 8: Problemas 1, 2 e 3 (Seção 8.2)'
    recomendacao: 'Sequência mais didática para começar. No 1 (moeda e dado), você monta a tabela conjunta a partir do experimento e verifica a independência. O 2 dá a tabela pronta e pede marginais, condicionais e independência; o item (b) pede a esperança e a variância de X e de Y, cada uma sozinha. O 3 dá a tabela incompleta e pede para completá-la supondo X e Y independentes: cada célula é o produto das marginais.'
  - livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
    exercicios: 'Cap. 5: Exercícios da Seção 5.3, n.º 14 (a, c), 15 (a, c), 17 (a, b), 18 (a, b), 19 (a, b, d, e) e 30'
    recomendacao: 'No 14 (dois dados), no 17 (bolas sorteadas com devolução) e no 18 (moeda lançada três vezes), você monta a conjunta a partir do experimento. O 15 dá a tabela pronta (com frações) e pede probabilidades de eventos. O 19 (palavras de uma frase) termina com uma condicional no item (e). O 30 é o mais desafiador: dá marginais, uma probabilidade conjunta e uma condicional, e você precisa montar a tabela toda. Os itens deixados de fora pedem esperança de funções de (X, Y), covariância ou correlação: Aula 24.'
  - livro: Montgomery & Runger, Estatística Aplicada e Probabilidade para Engenheiros, 7ª ed.
    exercicios: 'Cap. 5: 5.1.1, 5.1.2, 5.1.3 e 5.2.2 (a, b, d)'
    recomendacao: 'O 5.1.1 e o 5.1.2 dão a função de probabilidade conjunta (tabela no livro): verifique as propriedades, calcule probabilidades de eventos e a marginal de X; o item (e) pede esperança e variância de cada variável. O 5.1.3 (bits com distorção) é o mais trabalhoso: a conjunta sai contando os casos com três bits. O 5.2.2 usa a tabela do 5.1.1 para as condicionais e a independência; o item (c), esperança condicional, fica de fora.'
  - livro: 'Morettin, Estatística Básica: Probabilidade e Inferência'
    exercicios: 'Cap. 3: Exercícios propostos, n.º 21 (a, b)'
    recomendacao: 'Duas bolas retiradas sem reposição: monte a conjunta (a segunda retirada depende da primeira) e calcule a esperança e a variância de cada variável. Os itens (c) e (d), e os outros exercícios de distribuição conjunta do capítulo, pedem funções de (X, Y), covariância ou correlação: Aula 24.'
  arquivo: Tabela_Referencias_Aula23.pdf
