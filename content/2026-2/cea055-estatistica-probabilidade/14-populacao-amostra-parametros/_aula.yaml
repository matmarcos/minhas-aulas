titulo: Aula 14 - População, amostra, amostragem e parâmetros
data: ''
resumo: Conceitos de população e amostra; parâmetro, estimador e estimativa; erro
  amostral e vieses; amostragem probabilística e não probabilística; planos de amostragem
  (aleatória simples, estratificada, por conglomerados e sistemática)
bloco: 2
slides:
  titulo: Slides da aula 14
  arquivo: Aula_14_Populacao_Amostra_Parametros_SITE.pptx
  arquivo_pdf: Aula_14_Populacao_Amostra_Parametros_SITE.pdf
referencias_bibliograficas:
- livro: Bussab & Morettin, Estatística Básica, 9ª ed.
  citacao: Cap. 10 – 10.2, 10.4, 10.5, 10.6 e 10.14 (item 2, Planos probabilísticos)
- livro: Montgomery & Runger, Estatística Aplicada e Probabilidade para Engenheiros,
    7ª ed.
  citacao: Cap. 7 – 7.1
- livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
  citacao: Cap. 1 – 1.1 (trecho sobre seleção da amostra); Cap. 7 – 7.1
- livro: 'Morettin, Estatística Básica: Probabilidade e Inferência'
  citacao: Cap. 7 – 7.1, 7.2
pre_aula:
  leitura:
    itens:
    - Bussab & Morettin, Estatística Básica, 9ª ed. — Capítulo 10, seções 10.2, 10.4,
      10.5 e 10.6, e a seção 10.14, item 2 (Planos probabilísticos).
    - Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed. — Capítulo 1,
      seção 1.1 (trecho sobre a seleção da amostra), e Capítulo 7, seção 7.1.
    nota: As duas referências cobrem o mesmo conteúdo — basta ler uma.
  videos:
  - titulo: 'Estatística – Aula 13 – Amostragem: Conceitos Fundamentais (UNIVESP)'
    url: https://www.youtube.com/watch?v=sWJlocN-bpc
  tarefa:
  - Uma plataforma de streaming tem 50.000 assinantes e quer saber quantas horas,
    em média, eles assistem por semana. O time de dados sorteia 500 assinantes e mede
    as horas de cada um. A média da amostra foi 9,2 horas.
  - (a) Identifique a população, a amostra, o parâmetro, o estimador e a estimativa.
  - (b) Um colega sugere medir só quem estiver assistindo às 22h de sábado, "porque
    é mais fácil". Que tipo de viés isso causa? Para que lado a estimativa tende a
    errar?
  - (c) No sorteio dos 500 (sem reposição), qual a probabilidade de um assinante específico
    ser o primeiro sorteado? E de estar na amostra?
  - Tarefa opcional, sem entrega e sem nota — serve para você conferir se entendeu
    a leitura. Tente antes de abrir o gabarito.
  gabarito:
  - titulo: (a) Os nomes
    passos:
    - - População e amostra
      - os 50.000 assinantes; os 500 sorteados.
    - - Parâmetro
      - μ, a média de horas por semana de todos os assinantes — desconhecida.
    - - Estimador
      - a média amostral X̄ — a regra "some as horas da amostra e divida por n".
    - - Estimativa
      - 9,2 horas — o valor do estimador nesta amostra.
    - - Erro comum
      - chamar 9,2 de parâmetro. O parâmetro é da população; 9,2 vem da amostra.
  - titulo: (b) Quem assiste às 22h de sábado
    passos:
    - - Viés
      - de seleção — a amostra só tem quem estava assistindo naquele horário.
    - - Leitura
      - quem está assistindo num sábado à noite tende a ser quem assiste mais, então
        a estimativa tende a ficar acima da média real.
    - - Erro comum
      - achar que aumentar a amostra resolve. Uma amostra maior com o mesmo viés continua
        errando para o mesmo lado.
  - titulo: (c) Probabilidades na AAS
    passos:
    - - Primeiro sorteado
      - cada assinante tem a mesma chance, 1/50.000 = 0,00002.
    - - Estar na amostra
      - n/N = 500/50.000 = 0,01, ou seja, 1%.
    - - Leitura
      - na amostragem aleatória simples, todos têm a mesma chance de entrar — é isso
        que evita o viés de seleção.
exercicios_recomendados:
  itens:
  - livro: Bussab & Morettin, Estatística Básica, 9ª ed.
    exercicios: 'Cap. 10: Problemas 1 e 31'
    recomendacao: O Problema 1 pede para criticar diferentes planos de amostragem (bom
      para reconhecer vieses). O Problema 31 pergunta como sortear uma amostra em várias
      situações diferentes, sem contas.
  - livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
    exercicios: 'Cap. 7: Exercícios da Seção 7.1, 1 e 2'
    recomendacao: O Exercício 1 compara, na prática, o sorteio com e sem reposição.
      O Exercício 2 compara três planos de coleta e pede as dificuldades de cada um.
  - livro: Montgomery & Runger, Estatística Aplicada e Probabilidade para Engenheiros,
      7ª ed.
    exercicios: ''
    recomendacao: Não há exercícios da Seção 7.1; os do capítulo começam na Seção 7.2
      (distribuições amostrais, conteúdo da próxima aula).
  - livro: 'Morettin, Estatística Básica: Probabilidade e Inferência'
    exercicios: ''
    recomendacao: O Capítulo 7 (amostragem) não tem exercícios propostos.
