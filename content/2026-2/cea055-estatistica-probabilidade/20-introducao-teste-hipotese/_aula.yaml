material_complementar:
  texto:
  - Para as contas, use a sua tabela normal P(0 ≤ Z ≤ z) (Aulas 13 e 15). Nesta aula, tudo é feito na escala de X̄; a
    estatística padronizada Z e o valor-p ficam para a Aula 21.
