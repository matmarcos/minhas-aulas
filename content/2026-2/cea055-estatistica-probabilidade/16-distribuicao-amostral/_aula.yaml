titulo: Aula 16 - Distribuição amostral da média e da proporção
data: ''
resumo: Distribuições amostrais; distribuição amostral da média; distribuição amostral
  da proporção
bloco: 2
slides:
  titulo: Slides da aula 16
  arquivo: Aula_16_Distribuicao_Amostral.pptx
  arquivo_pdf: Aula_16_Distribuicao_Amostral.pdf
referencias_bibliograficas:
- livro: Bussab & Morettin, Estatística Básica, 9ª ed.
  citacao: Cap. 10 – 10.7 a 10.9
- livro: Montgomery & Runger, Applied Statistics and Probability for Engineers, 7ª
    ed.
  citacao: Cap. 7 – 7.2
- livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
  citacao: Cap. 7 – 7.3
- livro: 'Morettin, Estatística Básica: Probabilidade e Inferência'
  citacao: Cap. 9 – 9.1, 9.2
pre_aula:
  videos:
  - titulo: Teorema do Limite Central (introdução à distribuição amostral)
    url: https://www.youtube.com/watch?v=t31I49KYFDo
exercicios_recomendados:
  itens:
  - livro: Bussab & Morettin, Estatística Básica, 9ª ed.
    exercicios: 'Cap. 10: Problemas 4, 5, 6, 7, 8, 9, 10, 11, 12 e 13'
    recomendacao: 'Referência muito completa: os problemas 4 a 6 pedem para você construir
      a distribuição amostral "na mão" (bom para entender o conceito). Os problemas
      7 a 10 são sobre a média; 11 a 13, sobre a proporção.'
  - livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
    exercicios: 'Cap. 7 (7.5 Exercícios): 5, 6, 7, 8, 9, 10, 11, 12, 13 e 14'
    recomendacao: Boa variedade de contextos para a distribuição amostral da média,
      incluindo casos com diferentes tamanhos de amostra para você comparar o efeito
      de n na precisão.
  - livro: Montgomery & Runger, Applied Statistics and Probability for Engineers,
      7ª ed.
    exercicios: 'Cap. 7: Exercícios 7.2.1 a 7.2.9'
    recomendacao: Referência completa (9 exercícios ao todo). O exercício 7.2.1 é
      um bom ponto de partida — pede para você identificar qual parâmetro da população
      está sendo estimado.
  - livro: 'Morettin, Estatística Básica: Probabilidade e Inferência'
    exercicios: 'Cap. 9: Exercícios 1, 2, 3, 4 e 5'
    recomendacao: Os exercícios 1 a 3 treinam a distribuição amostral da média; 4
      e 5, a da proporção. Poucos exercícios, mas todos diretamente relevantes.
  arquivo: Tabela_Referencias_Aula16.pdf
