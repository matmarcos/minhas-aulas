  aviso: Playlist de videoaulas com boa cobertura de Estatística Descritiva, Probabilidade, Variáveis
    Aleatórias e estimação (média e variância) — inclusive construção de intervalos de confiança. Não
    cobre testes de hipótese, variáveis aleatórias multidimensionais, covariância/correlação nem regressão
    linear (Aulas 21 a 27) — o próprio professor menciona explicitamente que o curso para antes de chegar
    em testes de hipótese.
