titulo: Aula 04 - Técnicas de contagem
data: ''
resumo: Cálculo de probabilidades em espaços amostrais finitos utilizando o princípio
  multiplicativo e a análise combinatória (arranjo, permutação, combinação).
bloco: 1
slides:
  titulo: Slides da aula 04
  arquivo: Aula_04_Tecnicas_de_Contagem_SITE.pptx
  arquivo_pdf: Aula_04_Tecnicas_de_Contagem.pdf
referencias_bibliograficas:
- livro: Bussab & Morettin, Estatística Básica, 9ª ed.
  citacao: Cap. 5 – 5.2
- livro: Montgomery & Runger, Applied Statistics and Probability for Engineers, 7ª
    ed.
  citacao: Cap. 2 – 2.2
- livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
  citacao: Cap. 2 – 2.1
- livro: 'Morettin, Estatística Básica: Probabilidade e Inferência'
  citacao: Cap. 2 – 2.2, 2.3
pre_aula:
  leitura:
    itens:
    - Bussab & Morettin, Estatística Básica, 9ª ed. — Capítulo 5, seção 5.2 (princípio
      multiplicativo).
    - 'Morettin, Estatística Básica: Probabilidade e Inferência — Capítulo 2, seção
      2.2 (mesmo tema, segunda referência).'
    nota: As duas referências acima cobrem o mesmo conteúdo — leia a que você tiver
      disponível. Não precisa ter as duas nem ler as duas.
  videos:
  - titulo: Estatística e Probabilidade – Aula 03 – Análise combinatória (parte I)
      (UNIVESP)
    url: https://www.youtube.com/watch?v=avPlaW1oW_A
  tarefa:
  - Uma nave espacial pode decolar por 3 rotas diferentes, com 4 tipos de motor e 2
    tripulações disponíveis. De quantas formas diferentes é possível configurar a decolagem,
    escolhendo uma rota, um motor e uma tripulação?
  - Esta tarefa é opcional e não precisa ser entregue — serve para você se autoavaliar
    antes da aula. A verificação de verdade é feita em sala, no início da aula.
exercicios_recomendados:
  itens:
  - livro: Bussab & Morettin, Estatística Básica, 9ª ed.
    exercicios: 'Cap. 5: Problema 11'
    recomendacao: Este livro tem pouquíssimos exercícios de contagem propostos — a
      maior parte do conteúdo aparece só como exemplo já resolvido no texto (Exemplos
      5.8 e 5.9, se quiser estudar por lá). Para praticar mais, use as outras referências
      desta lista.
  - livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
    exercicios: ''
    recomendacao: Não encontramos exercícios de técnicas de contagem neste livro.
      Use as outras referências desta lista para praticar este conteúdo.
  - livro: Montgomery & Runger, Applied Statistics and Probability for Engineers,
      7ª ed.
    exercicios: 'Cap. 2: Exercícios 2.2.3, 2.2.4, 2.2.5, 2.2.6, 2.2.7, 2.2.9, 2.2.10,
      2.2.11, 2.2.12 e 2.2.14'
    recomendacao: 'Referência mais completa para esta aula: cobre princípio multiplicativo
      (2.2.3 a 2.2.5), permutações (2.2.6, 2.2.9, 2.2.12), arranjos (2.2.10, 2.2.11)
      e combinações (2.2.7, 2.2.14). Bom ponto de partida.'
  - livro: 'Morettin, Estatística Básica: Probabilidade e Inferência'
    exercicios: 'Cap. 2: Exercícios 5, 6, 7, 8, 9, 10, 11, 12, 13 e 17'
    recomendacao: Bons exercícios de combinação e princípio multiplicativo. Eles pedem
      para calcular uma probabilidade no final — é normal, contagem e probabilidade
      costumam andar juntas; o objetivo aqui é praticar a parte de contar os casos
      possíveis e favoráveis.
  arquivo: Tabela_Referencias_Aula4.pdf
