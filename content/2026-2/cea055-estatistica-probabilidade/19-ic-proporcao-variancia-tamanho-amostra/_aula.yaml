material_complementar:
  texto:
  - A tabela qui-quadrado de cauda superior é a mesma da Aula 17 (PDF "Tabelas t e qui-quadrado", na página da Aula 17).
    Para z, use a sua tabela normal P(0 ≤ Z ≤ z).
