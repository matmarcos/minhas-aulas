titulo: Aula 05 - Probabilidade condicional e independência
data: ''
resumo: Probabilidade condicional e regra do produto; eventos independentes e como
  verificar independência
bloco: 1
slides:
  titulo: Slides da aula 05
  arquivo: Aula_05_Probabilidade_Condicional_SITE.pptx
  arquivo_pdf: Aula_05_Probabilidade_Condicional_SITE.pdf
referencias_bibliograficas:
- livro: Bussab & Morettin, Estatística Básica, 9ª ed.
  citacao: Cap. 5 – 5.3
- livro: Montgomery & Runger, Applied Statistics and Probability for Engineers, 7ª
    ed.
  citacao: Cap. 2 – 2.5, 2.7
- livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
  citacao: Cap. 2 – 2.2
