pre_aula:
  leitura:
    itens:
    - Bussab & Morettin, Estatística Básica, 9ª ed. — Capítulo 5, seção 5.3 (probabilidade
      condicional).
    - Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed. — Capítulo 2,
      seção 2.2 (mesmo tema, segunda referência).
  videos:
  - titulo: 'Aula 2: Probabilidade Condicional e Independência'
    url: https://www.youtube.com/watch?v=HzOCwzzlGiA
  tarefa:
  - Uma urna tem 3 bolas azuis e 2 vermelhas. Sorteia-se uma bola, sem reposição,
    e depois outra. Calcule à mão a probabilidade de a segunda bola ser vermelha,
    dado que a primeira foi azul.
  - Nesse mesmo experimento, a cor da segunda bola é independente da cor da primeira?
    Justifique com base no cálculo acima.
exercicios_recomendados:
  itens:
  - livro: Bussab & Morettin, Estatística Básica, 9ª ed.
    exercicios: 'Cap. 5: Problemas 15, 16, 17, 18, 19, 20, 21 e 22'
    recomendacao: 'Boa sequência: começa com extrações de urna (15, 16), passa por
      independência (17, 19) e termina com sistemas de confiabilidade (20, 22), um
      tipo de aplicação prática de independência.'
  - livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
    exercicios: 'Cap. 2 (2.3 Exercícios): 10, 11, 12, 13, 14, 17, 19, 20, 21 e 22'
    recomendacao: Vários exercícios com tabelas de contingência (bom treino de probabilidade
      condicional a partir de dados reais). O exercício 20 é o mais completo para
      entender independência, com vários casos diferentes no mesmo problema.
  - livro: Montgomery & Runger, Applied Statistics and Probability for Engineers,
      7ª ed.
    exercicios: 'Cap. 2: Exercícios 2.5.1, 2.5.4, 2.5.6, 2.5.9, 2.5.11, 2.7.1, 2.7.2,
      2.7.4, 2.7.6 e 2.7.10'
    recomendacao: Os exercícios 2.5.x treinam probabilidade condicional (muitos usando
      tabelas). Os 2.7.x treinam independência, incluindo como verificar se dois eventos
      são independentes a partir de dados.
  - livro: 'Morettin, Estatística Básica: Probabilidade e Inferência'
    exercicios: 'Cap. 2: Exercício 18'
    recomendacao: Esta referência tem só um exercício claramente focado em independência
      para esta aula — os demais exercícios do capítulo exigem mais técnicas de contagem
      do que o conteúdo desta aula pede. Prefira as outras referências para praticar
      mais.
  arquivo: Tabela_Referencias_Aula5.pdf
