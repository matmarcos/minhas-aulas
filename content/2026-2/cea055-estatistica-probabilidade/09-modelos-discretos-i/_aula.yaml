pre_aula:
  videos:
  - titulo: 'Aula 8: Uniforme discreta, Bernoulli e Binomial'
    url: https://www.youtube.com/watch?v=zKlRBfVGsyM
  - titulo: 'Aula 10: Geométrica, binomial negativa e hipergeométrica'
