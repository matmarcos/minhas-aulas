exercicios_recomendados:
  itens:
  - livro: Bussab & Morettin, Estatística Básica, 9ª ed.
    exercicios: 'Cap. 6: Problema 20'
    recomendacao: Este livro tem poucos exercícios dedicados só a uniforme discreta,
      Bernoulli ou geométrica isoladamente — a maioria já mistura com binomial. O
      problema 20 ajuda a reconhecer quando um experimento é (ou não) uma sequência
      de ensaios de Bernoulli. Use o Montgomery para praticar mais.
  - livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
    exercicios: 'Cap. 3 (3.4 Exercícios): 24 e 25'
    recomendacao: Só encontramos exercícios específicos sobre distribuição geométrica
      nesta lista (24 e 25). Não há exercícios isolados de uniforme discreta ou Bernoulli
      neste livro — use o Montgomery para essa parte.
  - livro: Montgomery & Runger, Applied Statistics and Probability for Engineers,
      7ª ed.
    exercicios: 'Cap. 3: Exercícios 3.4.1, 3.4.2, 3.4.3, 3.4.4, 3.4.5, 3.6.1, 3.6.3,
      3.6.4, 3.6.5 e 3.6.6'
    recomendacao: 'Referência mais completa para esta aula: os exercícios 3.4.x treinam
      a uniforme discreta e os 3.6.x treinam a geométrica. Bom ponto de partida.'
  - livro: 'Morettin, Estatística Básica: Probabilidade e Inferência'
    exercicios: ''
    recomendacao: Não encontramos, na lista de exercícios propostos deste livro, problemas
      dedicados especificamente à uniforme discreta, Bernoulli ou geométrica — a lista
      concentra-se em binomial e Poisson. Use as outras referências desta lista.
  arquivo: Tabela_Referencias_Aula9.pdf
