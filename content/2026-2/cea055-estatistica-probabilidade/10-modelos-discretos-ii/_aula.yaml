  tarefa:
  - Uma equipe de ciência de dados cuida do sistema de login e da base de clientes
    de uma empresa. Para cada situação, monte a expressão da probabilidade pedida
    — não precisa calcular o valor final.
  - (a) Chegam 8 tentativas de login, independentes, e cada uma é bloqueada pelo filtro
    antifraude com probabilidade 0,1. Monte a expressão da probabilidade de exatamente
    2 tentativas serem bloqueadas.
  - (b) Uma base tem 30 registros de clientes, e 6 deles têm dados faltando. Um analista
    sorteia 4 registros diferentes para inspecionar. Monte a expressão da probabilidade
    de exatamente 1 dos 4 ter dados faltando.
  - (c) E se, no item (b), o analista devolvesse cada registro à base antes de sortear
    o próximo? Qual modelo passaria a valer, e qual seria a expressão?
  - Diferente de um exercício comum, este puzzle pede só a estrutura do raciocínio
    — reconhecer qual modelo se aplica e montar a expressão certa —, não o cálculo
    numérico final. Tarefa opcional, sem entrega; a verificação de verdade é feita
    em sala, no início da aula.
  gabarito:
  - titulo: (a) Tentativas de login bloqueadas
    passos:
    - - Modelo
      - 'binomial: n = 8 tentativas independentes, cada uma bloqueada com a mesma
        p = 0,1.'
    - - Expressão
      - P(X = 2) = C(8,2) · (0,1)² · (0,9)⁶.
    - - Valor
      - 28 · 0,01 · 0,531441 ≈ 0,1488.
  - titulo: (b) Registros sorteados sem reposição
    passos:
    - - Modelo
      - 'hipergeométrica: população pequena (N = 30, com r = 6 incompletos), amostra
        de n = 4 sem reposição.'
    - - Expressão
      - P(X = 1) = C(6,1) · C(24,3) / C(30,4).
    - - Valor
      - 6 · 2024 / 27405 ≈ 0,4431.
    - - Erro comum
      - 'usar a binomial: sem reposição, a chance muda a cada registro sorteado.'
  - titulo: (c) Com reposição
    passos:
    - - Modelo
      - 'binomial: devolvendo o registro, cada sorteio tem a mesma chance p = 6/30
        = 0,2 e os sorteios ficam independentes.'
    - - Expressão
      - P(X = 1) = C(4,1) · (0,2)¹ · (0,8)³.
    - - Valor
      - 4 · 0,2 · 0,512 = 0,4096 — próximo de (b), mas não igual.
exercicios_recomendados:
  itens:
  - livro: Bussab & Morettin, Estatística Básica, 9ª ed.
    exercicios: 'Cap. 6: Problemas 20, 21, 24, 25, 26, 27 e 28'
    recomendacao: 'Comece pelo problema 20: ele pede para você reconhecer se cada
      situação é binomial ou não — o item (b), com extração sem reposição, é justamente
      o caso hipergeométrico. Os problemas 26 a 28 pedem para esboçar gráficos, bom
      treino visual.'
  - livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
    exercicios: 'Cap. 3 (3.4 Exercícios): 16, 17, 18, 19, 26 e 27'
    recomendacao: Os exercícios 16 a 19 são de binomial. Os exercícios 26 e 27 usam
      extração sem reposição (jacarés e livros defeituosos) — é aí que entra a hipergeométrica.
  - livro: Montgomery & Runger, Applied Statistics and Probability for Engineers,
      7ª ed.
    exercicios: 'Cap. 3: Exercícios 3.5.1, 3.5.2, 3.5.3, 3.5.4, 3.7.1, 3.7.2, 3.7.3,
      3.7.4 e 3.7.6'
    recomendacao: 'Referência mais completa: o exercício 3.5.1 treina reconhecer quando
      o modelo binomial se aplica (compare com o problema 20 do Bussab). O 3.7.6 (loteria)
      é um clássico para entender hipergeométrica.'
  - livro: 'Morettin, Estatística Básica: Probabilidade e Inferência'
    exercicios: 'Cap. 4: Exercícios 3, 4, 5, 7 e 8'
    recomendacao: Os exercícios 4, 7 e 8 são de binomial. Os exercícios 3 e 5 envolvem
      amostragem sem reposição de um lote — são os casos de hipergeométrica nesta
      lista.
