titulo: Aula 19 - Intervalo de confiança para a média
data: ''
resumo: Intervalo de confiança para a média populacional com desvio padrão conhecido
  e desconhecido
bloco: 3
slides:
  titulo: Slides da aula 19
  arquivo: Aula_19_Intervalo_Confianca_Media.pptx
  arquivo_pdf: Aula_19_Intervalo_Confianca_Media.pdf
referencias_bibliograficas:
- livro: Bussab & Morettin, Estatística Básica, 9ª ed.
  citacao: Cap. 11 – 11.6
- livro: Montgomery & Runger, Applied Statistics and Probability for Engineers, 7ª
    ed.
  citacao: Cap. 8 – 8.1, 8.2
- livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
  citacao: Cap. 7 – 7.4
- livro: 'Morettin, Estatística Básica: Probabilidade e Inferência'
  citacao: Cap. 11 – 11.1, 11.2; Cap. 14 – 14.2
pre_aula:
  videos:
  - titulo: 'Aula 22: Intervalo de Confiança'
    url: https://www.youtube.com/watch?v=AkmyfLc-EOs
exercicios_recomendados:
  itens:
  - livro: Bussab & Morettin, Estatística Básica, 9ª ed.
    exercicios: 'Cap. 11: Problemas 14, 15, 16 e 17'
    recomendacao: O problema 14 é o mais direto (só aplicar a fórmula com dados já
      prontos). Os problemas 15 a 17 já misturam o cálculo do IC com determinação
      do tamanho de amostra necessário.
  - livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
    exercicios: 'Cap. 7 (7.5 Exercícios): 18, 20, 22, 23 e 28'
    recomendacao: 'Boa variedade: variância populacional conhecida (18, 20, 23) e
      desconhecida com amostra grande (28). O exercício 22 inverte o problema — dá
      o intervalo pronto e pede para você descobrir a média amostral.'
  - livro: Montgomery & Runger, Applied Statistics and Probability for Engineers,
      7ª ed.
    exercicios: 'Cap. 8: Exercícios 8.1.1, 8.1.3, 8.1.4, 8.1.5, 8.1.6, 8.2.1, 8.2.3,
      8.2.5, 8.2.6 e 8.2.9'
    recomendacao: 'Referência mais completa: os exercícios 8.1.x são com variância
      conhecida; os 8.2.x, com variância desconhecida (usando t de Student). O exercício
      8.1.5(b,c) discute o que um intervalo de confiança realmente significa — vale
      refletir com calma.'
  - livro: 'Morettin, Estatística Básica: Probabilidade e Inferência'
    exercicios: 'Cap. 11: Exercícios 1, 2, 3, 4, 5, 6, 11 e 12'
    recomendacao: Os exercícios 1 a 6 usam variância conhecida; 11 e 12, variância
      desconhecida com amostra grande. Os exercícios 4 e 12 também pedem o tamanho
      de amostra necessário para um erro específico.
  arquivo: Tabela_Referencias_Aula19.pdf
