titulo: Aula 21 - Introdução ao teste de hipóteses
data: ''
resumo: Hipótese nula e alternativa; tipos de erro (I e II); nível de significância
bloco: 3
slides:
  titulo: Slides da aula 21
  arquivo: Aula_21_Introducao_Teste_Hipotese.pptx
  arquivo_pdf: Aula_21_Introducao_Teste_Hipotese.pdf
referencias_bibliograficas:
- livro: Bussab & Morettin, Estatística Básica, 9ª ed.
  citacao: Cap. 12 – 12.1 a 12.4
- livro: Montgomery & Runger, Applied Statistics and Probability for Engineers, 7ª
    ed.
  citacao: Cap. 9 – 9.1
- livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
  citacao: Cap. 8 – 8.1
- livro: 'Morettin, Estatística Básica: Probabilidade e Inferência'
  citacao: Cap. 12 – 12.1; Cap. 13 – 13.1
pre_aula:
  videos:
  - titulo: 'Aula 23: Teste de hipóteses'
    url: https://www.youtube.com/watch?v=S3V5qJ1bxhk
exercicios_recomendados:
  itens:
  - livro: Bussab & Morettin, Estatística Básica, 9ª ed.
    exercicios: 'Cap. 12 (12.11 Problemas Suplementares): 28, 29, 38 e 39'
    recomendacao: 'O exercício 28 é o mais completo para esta aula: pede para definir
      H0/H1, descrever os erros tipo I e II e montar a regra de decisão — praticamente
      um roteiro do que esta aula ensina.'
  - livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
    exercicios: 'Cap. 8 (8.6 Exercícios): 11(a-d), 16(a) e 18(a)'
    recomendacao: Resolva só as partes indicadas (a definição do parâmetro, das hipóteses
      e do critério de decisão) — o restante desses exercícios já entra em cálculo
      específico de teste, conteúdo das próximas aulas.
  - livro: Montgomery & Runger, Applied Statistics and Probability for Engineers,
      7ª ed.
    exercicios: 'Cap. 9: Exercícios 9.1.1, 9.1.2, 9.1.3, 9.1.5, 9.1.6, 9.1.7, 9.1.9,
      9.1.10, 9.1.11 e 9.1.12'
    recomendacao: Referência mais completa para esta aula. Comece pelo 9.1.1 (identificar
      se um par de hipóteses está corretamente formulado) e pelo 9.1.2 (interpretar
      o que significa "não rejeitar H0") antes de ir para os que envolvem cálculo
      de erro tipo I e II.
  - livro: 'Morettin, Estatística Básica: Probabilidade e Inferência'
    exercicios: 'Cap. 13: Exercícios 1, 3 e 4'
    recomendacao: Esses exercícios tratam dos erros de decisão (tipo I e II) e da
      curva de poder do teste — o conceito central desta aula.
  arquivo: Tabela_Referencias_Aula21.pdf
