titulo: Aula 20 - Intervalo de confiança para proporção e variância; tamanho de amostra
data: ''
resumo: Intervalo de confiança para a proporção populacional; intervalo de confiança
  para a variância populacional; determinação do tamanho de amostra
bloco: 3
slides:
  titulo: Slides da aula 20
  arquivo: Aula_20_IC_Proporcao_Variancia_TamanhoAmostra.pptx
  arquivo_pdf: Aula_20_IC_Proporcao_Variancia_TamanhoAmostra.pdf
referencias_bibliograficas:
- livro: Bussab & Morettin, Estatística Básica, 9ª ed.
  citacao: Cap. 11 – 11.6; Cap. 10 – 10.11
- livro: Montgomery & Runger, Applied Statistics and Probability for Engineers, 7ª
    ed.
  citacao: Cap. 8 – 8.3, 8.4, 8.1.2
- livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
  citacao: Cap. 7 – 7.4, 7.5
- livro: 'Morettin, Estatística Básica: Probabilidade e Inferência'
  citacao: Cap. 16 – 16.2, 16.3
pre_aula:
  videos:
  - titulo: 'Aula 22: Intervalo de Confiança'
    url: https://www.youtube.com/watch?v=AkmyfLc-EOs
exercicios_recomendados:
  itens:
  - livro: Bussab & Morettin, Estatística Básica, 9ª ed.
    exercicios: 'Cap. 11: Problemas 18, 19, 20 e 21'
    recomendacao: Todos são sobre proporção. Os problemas 20 e 21(b) pedem, além do
      intervalo, o tamanho de amostra necessário — resolva essa parte com atenção
      especial. Não encontramos, nesta seção, exercício dedicado a intervalo de confiança
      para variância.
  - livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
    exercicios: 'Cap. 7 (7.5 Exercícios): 24, 25, 26 e 29'
    recomendacao: Todos sobre proporção e tamanho de amostra. Como no Bussab, não
      encontramos exercício de IC para variância nesta lista — use o Montgomery ou
      o Morettin para essa parte específica.
  - livro: Montgomery & Runger, Applied Statistics and Probability for Engineers,
      7ª ed.
    exercicios: 'Cap. 8: Exercícios 8.1.2, 8.3.1, 8.3.2, 8.3.3, 8.4.1, 8.4.3, 8.4.4,
      8.4.5 e 8.4.6'
    recomendacao: 'Referência mais completa: os 8.3.x são de variância (usando qui-quadrado)
      e os 8.4.x são de proporção. O exercício 8.1.2 treina só encontrar o valor de
      z para diferentes níveis de confiança — útil antes de resolver os demais.'
  - livro: 'Morettin, Estatística Básica: Probabilidade e Inferência'
    exercicios: 'Cap. 16: Exercícios 1, 2, 3, 4 e 5'
    recomendacao: Única referência desta lista com exercícios dedicados a intervalo
      de confiança para variância (usando a distribuição qui-quadrado) — complementa
      bem as outras três referências, que só cobrem proporção.
  arquivo: Tabela_Referencias_Aula20.pdf
