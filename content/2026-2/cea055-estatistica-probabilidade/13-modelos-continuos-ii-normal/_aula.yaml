titulo: 'Aula 13 - Modelos contínuos II: distribuição normal e normal padrão'
data: ''
resumo: Distribuição normal; padronização (Z); uso da tabela da normal padrão
bloco: 2
slides:
  titulo: Slides da aula 13
  arquivo: Aula_13_Modelos_Continuos_II_Normal.pptx
  arquivo_pdf: Aula_13_Modelos_Continuos_II_Normal.pdf
referencias_bibliograficas:
- livro: Bussab & Morettin, Estatística Básica, 9ª ed.
  citacao: Cap. 7 – 7.4.2
- livro: Montgomery & Runger, Applied Statistics and Probability for Engineers, 7ª
    ed.
  citacao: Cap. 4 – 4.5
- livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
  citacao: Cap. 6 – 6.2
