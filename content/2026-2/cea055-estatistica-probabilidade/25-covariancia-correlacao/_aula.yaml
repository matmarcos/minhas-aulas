titulo: Aula 25 - Covariância e correlação
data: ''
resumo: Covariância entre duas variáveis aleatórias; coeficiente de correlação
bloco: 3
slides:
  titulo: Slides da aula 25
  arquivo: Aula_25_Covariancia_Correlacao.pptx
  arquivo_pdf: Aula_25_Covariancia_Correlacao.pdf
referencias_bibliograficas:
- livro: Bussab & Morettin, Estatística Básica, 9ª ed.
  citacao: Cap. 8 – 8.4
- livro: Montgomery & Runger, Applied Statistics and Probability for Engineers, 7ª
    ed.
  citacao: Cap. 5 – 5.4
- livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
  citacao: Cap. 5 – 5.2
pre_aula:
  videos:
  - titulo: 'Análise Exploratória de Dados: Correlação de Pearson e Spearman'
    url: https://youtu.be/qqRUsY2Fu0A
exercicios_recomendados:
  itens:
  - livro: Bussab & Morettin, Estatística Básica, 9ª ed.
    exercicios: 'Cap. 8: Problemas 11, 12, 13, 14, 15, 16 e 17'
    recomendacao: 'Muito completa. O problema 16 é o único que parte de dados brutos
      (nota e produtividade) em vez de uma distribuição pronta — bom para praticar
      o cálculo do zero. Os problemas 13 e 17 ensinam uma lição importante: covariância
      zero não garante independência.'
  - livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
    exercicios: 'Cap. 5 (5.3 Exercícios): 29 e 32'
    recomendacao: Poucos exercícios dedicados especificamente ao cálculo de covariância
      nesta lista — a maioria dos exercícios do capítulo já foi usada na Aula 24 (distribuição
      conjunta). Use as outras referências para praticar mais.
  - livro: Montgomery & Runger, Applied Statistics and Probability for Engineers,
      7ª ed.
    exercicios: 'Cap. 5: Exercícios 5.4.1, 5.4.2, 5.4.3, 5.4.5, 5.4.6, 5.5.3 e 5.5.6'
    recomendacao: Referência mais completa. Os exercícios 5.4.x calculam covariância
      e correlação de distribuições genéricas; os 5.5.x já são no contexto da distribuição
      normal bivariada, com o parâmetro ρ dado diretamente.
  - livro: 'Morettin, Estatística Básica: Probabilidade e Inferência'
    exercicios: ''
    recomendacao: Este livro não é referência bibliográfica desta aula específica
      no nosso plano de curso — ele trata de distribuições conjuntas (Aula 24), mas
      não desenvolve covariância e correlação como tópico próprio. Use as outras três
      referências.
  arquivo: Tabela_Referencias_Aula25.pdf
lista_ia:
