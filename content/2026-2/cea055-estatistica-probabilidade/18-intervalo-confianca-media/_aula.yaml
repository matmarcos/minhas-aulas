titulo: Aula 18 - Intervalo de confiança para a média
data: ''
resumo: Por que um intervalo informa mais que uma estimativa pontual; intervalo de confiança para μ com σ conhecido
  (normal) e com σ desconhecido (t de Student); o que significa "95% de confiança"; o que muda a amplitude; amostra
  grande
bloco: 3
slides:
  titulo: Slides da aula 18
  arquivo: Aula_18_Intervalo_Confianca_Media_SITE.pptx
  arquivo_pdf: Aula_18_Intervalo_Confianca_Media_SITE.pdf
referencias_bibliograficas:
- livro: Bussab & Morettin, Estatística Básica, 9ª ed.
  citacao: Cap. 11 – 11.6, 11.7
- livro: Montgomery & Runger, Estatística Aplicada e Probabilidade para Engenheiros, 7ª ed.
  citacao: Cap. 8 – introdução, 8.1.1, 8.1.5, 8.2.2
- livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
  citacao: Cap. 7 – 7.4
- livro: 'Morettin, Estatística Básica: Probabilidade e Inferência'
  citacao: Cap. 11 – 11.1, 11.2; Cap. 14 – 14.2
pre_aula:
  leitura:
    itens:
    - Bussab & Morettin, Estatística Básica, 9ª ed. — Capítulo 11, seção 11.6 (intervalo de confiança), até o intervalo
      para a média com σ conhecido.
    - Montgomery & Runger, Estatística Aplicada e Probabilidade para Engenheiros, 7ª ed. — Capítulo 8, introdução e
      seção 8.1.1.
    nota: 'As duas referências cobrem o mesmo conteúdo — basta ler uma. Atenção: o Bussab chama o nível de confiança
      de "coeficiente de confiança" (γ). Na aula usamos nível de confiança (1 − α).'
  videos:
  - titulo: 'Inferência Estatística: Intervalo de Confiança (Prof. Francisco Rodrigues)'
    url: https://www.youtube.com/watch?v=AkmyfLc-EOs
  tarefa:
  - Uma mineradora de Araxá mede o teor de nióbio do minério que extrai. O teor tem distribuição normal com desvio
    padrão conhecido σ = 0,5 ponto percentual. Numa amostra de n = 16 cargas, o teor médio foi x̄ = 2,4%.
  - 'Use a tabela normal P(0 ≤ Z ≤ z): ela dá a área entre 0 e z.'
  - (a) Quanto vale o erro padrão σ/√n?
  - (b) Para 95% de confiança, sobram 5% nas duas pontas. Que área você procura no corpo da tabela, e qual é o z correspondente?
  - (c) Construa o intervalo x̄ ± z·σ/√n.
  - (d) Qual é a amplitude do intervalo? E se a amostra tivesse n = 64 cargas, com o mesmo x̄?
  - '(e) Um colega disse: "há 95% de probabilidade de o teor médio μ estar no intervalo de (c)". Isso está certo?'
  - Tarefa opcional, sem entrega e sem nota — serve para você conferir se entendeu a leitura. Tente antes de abrir
    o gabarito.
  gabarito:
  - titulo: (a) Erro padrão
    passos:
    - - Conta
      - σ/√n = 0,5/√16 = 0,5/4 = 0,125 ponto percentual.
  - titulo: (b) Valor de z
    passos:
    - - Tabela
      - 95% no meio deixam 2,5% em cada ponta. Procure 0,5 − 0,025 = 0,475 no corpo da tabela → z = 1,96.
    - - Erro comum
      - procurar 0,95 ou 0,025 no corpo da tabela. Essa tabela começa em 0, não em −∞.
  - titulo: (c) Intervalo
    passos:
    - - Margem de erro
      - 1,96 × 0,125 = 0,245.
    - - Intervalo
      - IC(μ; 95%) = [2,4 − 0,245 ; 2,4 + 0,245] = [2,155 ; 2,645]%.
  - titulo: (d) Amplitude
    passos:
    - - Conta
      - amplitude = 2 × 0,245 = 0,49 ponto percentual.
    - - Com n = 64
      - σ/√n = 0,5/8 = 0,0625, e a amplitude cai para 0,245 — a metade. Quatro vezes mais cargas reduzem a amplitude
        à metade.
  - titulo: (e) Interpretação
    passos:
    - - Resposta
      - 'não. μ é um número fixo: o intervalo [2,155 ; 2,645] contém μ ou não contém.'
    - - O correto
      - se repetíssemos a amostragem muitas vezes, cerca de 95% dos intervalos construídos assim conteriam μ.
exercicios_recomendados:
  itens:
  - livro: Bussab & Morettin, Estatística Básica, 9ª ed.
    exercicios: 'Cap. 11: Problemas 14 e 15 (a, b); Problemas Suplementares 23 (a), 24 (a) e 25'
    recomendacao: O 14 é o mais direto (σ conhecido, três níveis de confiança). O 15 e o Suplementar 25 têm amostra
      grande com σ desconhecido (use s com a normal); no 25, calcule x̄ e s da tabela de frequências. No 24 (a), calcule
      x̄ a partir dos dados. O Bussab chama o nível de confiança de "coeficiente de confiança" (γ).
  - livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
    exercicios: 'Cap. 7 (7.5 Exercícios): 18, 19, 20, 21, 22, 23 (b) e 28'
    recomendacao: O 18 mostra o efeito do nível de confiança e de n na amplitude; o 19 é de interpretação; o 21 (c)
      e o 22 invertem o problema (dão o intervalo e pedem o nível de confiança ou a média amostral). O 28 tem amostra
      grande (n = 100). O Magalhães escreve z com índice γ/2, sendo γ o nível de confiança; é o mesmo valor que o nosso z(α/2)
      (1,96 para 95%).
  - livro: Montgomery & Runger, Estatística Aplicada e Probabilidade para Engenheiros, 7ª ed.
    exercicios: 'Cap. 8: 8.1.1, 8.1.3, 8.1.5, 8.1.6, 8.1.7 (a), 8.1.8, 8.1.10, 8.1.12 (a) e 8.1.13 (a, b); 8.2.1, 8.2.3,
      8.2.6, 8.2.7, 8.2.9 (b) e 8.2.11 (b)'
    recomendacao: Os 8.1.x são com σ conhecido; os 8.2.x, com σ desconhecido (distribuição t). O 8.1.5 (b, c) discute
      o que "95% de confiança" significa. Nos 8.2.9 e 8.2.11, só o IC bilateral — os gráficos de normalidade e os limites
      unilaterais não foram vistos.
  - livro: 'Morettin, Estatística Básica: Probabilidade e Inferência'
    exercicios: 'Cap. 11 (Exercícios propostos): 1, 2, 3 (a, b), 4 (a, b), 11 e 12 (a); Cap. 14 (Exercícios propostos
      1): 1, 2, 4, 5 e 8'
    recomendacao: 'Atenção: o Morettin escreve "ao nível de 5%" querendo dizer nível de confiança de 95% (ele chama
      α de nível de significância). Os do Cap. 11 usam z; os do Cap. 14, a t. Os itens de tamanho de amostra ficam
      para a Aula 19.'
