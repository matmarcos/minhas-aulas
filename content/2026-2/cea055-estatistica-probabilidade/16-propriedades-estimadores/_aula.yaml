titulo: Aula 16 - Propriedades dos estimadores
data: ''
resumo: Estimador não viesado e viés; variância amostral S² (por que dividir por n − 1); estimador consistente;
  estimador mais eficiente; por que usaremos X̄, p̂ e S²
bloco: 2
slides:
  titulo: Slides da aula 16
  arquivo: Aula_16_Propriedades_Estimadores.pptx
  arquivo_pdf: Aula_16_Propriedades_Estimadores.pdf
referencias_bibliograficas:
- livro: Bussab & Morettin, Estatística Básica, 9ª ed.
  citacao: Cap. 11 – 11.1, 11.2
- livro: Montgomery & Runger, Estatística Aplicada e Probabilidade para Engenheiros,
    7ª ed.
  citacao: Cap. 7 – 7.3.1, 7.3.2
- livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
  citacao: Cap. 7 – 7.2
- livro: 'Morettin, Estatística Básica: Probabilidade e Inferência'
  citacao: Cap. 10 – 10.3
pre_aula:
  leitura:
    itens:
    - Bussab & Morettin, Estatística Básica, 9ª ed. — Capítulo 11, seções 11.1 e 11.2.
    - Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed. — Capítulo 7, seção
      7.2.
    nota: As duas referências cobrem o mesmo conteúdo — basta ler uma.
  videos:
  - titulo: Estimadores e suas propriedades (Dhiego Loiola de Araujo)
    url: https://www.youtube.com/watch?v=5KTwIKydljU
  - titulo: Variância amostral (Khan Academy Brasil)
    url: https://www.youtube.com/watch?v=1in0w9bVoVc
  tarefa:
  - 'Um time de testes conta os bugs encontrados em cada versão de um app. Cada versão
    tem 0, 2 ou 4 bugs, cada valor com probabilidade 1/3. Assim, a média da população
    é μ = 2 bugs. O time sorteia 2 versões ao acaso. As 9 amostras possíveis são: 0 e
    0; 0 e 2; 0 e 4; 2 e 0; 2 e 2; 2 e 4; 4 e 0; 4 e 2; 4 e 4.'
  - (a) Em cada amostra, calcule a média X̄ e o menor valor. Depois, calcule a média das
    9 estimativas de cada regra. Qual das duas regras é não viesada para μ? Qual é o
    viés da outra?
  - (b) Calcule a variância da população, σ².
  - (c) Em cada amostra, calcule σ̂² (soma dos quadrados dos desvios dividida por n = 2)
    e s² (dividida por n − 1 = 1). Calcule a média das 9 estimativas de cada fórmula.
    Qual delas é não viesada?
  - (d) Um colega propõe estimar μ usando só o número de bugs da primeira versão sorteada.
    Essa regra é não viesada? Ela melhora se o time sortear mais versões?
  - Tarefa opcional, sem entrega e sem nota — serve para você conferir se entendeu a leitura.
    Tente antes de abrir o gabarito.
  gabarito:
  - titulo: (a) Média e menor valor
    passos:
    - - Média
      - 'médias das 9 amostras: 0, 1, 2, 1, 2, 3, 2, 3, 4; soma 18; média das 9: 18/9 =
        2 = μ. X̄ é não viesado.'
    - - Menor valor
      - 'menores valores: 0, 0, 0, 0, 2, 2, 0, 2, 4; soma 10; média das 9: 10/9 ≈ 1,11.
        É viesado, com viés ≈ 1,11 − 2 = −0,89: em média, subestima μ.'
  - titulo: (b) Variância da população
    passos:
    - - Conta
      - σ² = [(0 − 2)² + (2 − 2)² + (4 − 2)²]/3 = 8/3 ≈ 2,67.
  - titulo: (c) Dividir por n ou por n − 1
    passos:
    - - Uma amostra
      - '0 e 2: média 1, desvios −1 e 1, soma dos quadrados 2; então σ̂² = 2/2 = 1 e s²
        = 2/1 = 2.'
    - - Todas
      - 'amostras iguais: σ̂² = 0 e s² = 0; diferença 2 (quatro amostras): σ̂² = 1 e s²
        = 2; diferença 4 (duas amostras): σ̂² = 4 e s² = 8.'
    - - Médias
      - 'σ̂²: (4 × 1 + 2 × 4)/9 = 12/9 ≈ 1,33, só a metade de σ²; s²: (4 × 2 + 2 × 8)/9
        = 24/9 ≈ 2,67 = σ². S² é não viesado; σ̂² subestima σ².'
    - - Erro comum
      - achar que, por ser a variância da Aula 2, σ̂² deveria acertar.
  - titulo: (d) Só a primeira versão
    passos:
    - - Viés
      - 'estimativas: 0, 0, 0, 2, 2, 2, 4, 4, 4; média 18/9 = 2 = μ. É não viesada.'
    - - Consistência
      - não melhora com mais versões, porque ignora todas as versões depois da primeira;
        a variância continua σ², qualquer que seja n. Não é consistente. Já a variância
        de X̄, σ²/n, diminui quando n cresce.
    - - Leitura
      - acertar em média não basta.
exercicios_recomendados:
  itens:
  - livro: Bussab & Morettin, Estatística Básica, 9ª ed.
    exercicios: 'Cap. 11: Problemas 1, 2, 3, 4 e 5 (fim da seção 11.2); Problemas Suplementares
      22 e 38'
    recomendacao: Os Problemas 1 a 4 tratam da proporção amostral (viés, variância e consistência);
      o 5 compara dois estimadores por simulação. O Suplementar 22 escolhe entre dois
      estimadores a partir de uma tabela de frequências; o 38 compara estimadores ponderados
      (eficiência).
  - livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
    exercicios: 'Cap. 7 (7.5 Exercícios): 3, 4, 8 e 31'
    recomendacao: O 3 calcula as duas estimativas da variância (dividindo por n e por
      n − 1); o 4 verifica que X̄ é não viciado com uma amostra de tamanho 2; o 8 verifica,
      em três modelos, se S² é não viciado; o 31 usa o computador para estudar S² em 120
      amostras.
  - livro: Montgomery & Runger, Estatística Aplicada e Probabilidade para Engenheiros,
      7ª ed.
    exercicios: 'Cap. 7: 7.3.2, 7.3.3, 7.3.4, 7.3.6 (a, b, c) e 7.3.7 (a, b, d)'
    recomendacao: O livro chama o viés de "tendência". O 7.3.3 calcula o viés de Σ(Xᵢ −
      X̄)²/c (por que n − 1); o 7.3.2 e o 7.3.4 comparam estimadores (eficiência); o 7.3.6
      e o 7.3.7 calculam estimativas pontuais com dados (os itens indicados evitam o erro-padrão,
      que não foi visto).
  - livro: 'Morettin, Estatística Básica: Probabilidade e Inferência'
    exercicios: '—'
    recomendacao: O Cap. 10 (seção 10.3, até "Estimação por intervalo") serve como leitura;
      o capítulo não tem exercícios próprios.
