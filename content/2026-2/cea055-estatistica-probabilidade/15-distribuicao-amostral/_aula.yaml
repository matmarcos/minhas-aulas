exercicios_recomendados:
  itens:
  - livro: Bussab & Morettin, Estatística Básica, 9ª ed.
    exercicios: 'Cap. 10: Problemas 4, 5, 6, 7, 8, 9, 10, 11, 12 e 13'
    recomendacao: 'Referência muito completa: os problemas 4 a 6 pedem para você construir a
      distribuição amostral "na mão" (bom para entender o conceito). Os problemas 7 a 10 são
      sobre a média; 11 a 13, sobre a proporção.'
  - livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
    exercicios: 'Cap. 7 (7.5 Exercícios): 5, 6, 7, 8, 9, 10, 11, 12, 13 e 14'
    recomendacao: Boa variedade de contextos para a distribuição amostral da média, incluindo
      casos com diferentes tamanhos de amostra para você comparar o efeito de n na precisão.
  - livro: Montgomery & Runger, Applied Statistics and Probability for Engineers, 7ª ed.
    exercicios: 'Cap. 7: Exercícios 7.2.1 a 7.2.9'
    recomendacao: Referência completa (9 exercícios ao todo). O exercício 7.2.1 é um bom ponto
      de partida — pede para você identificar qual parâmetro da população está sendo estimado.
  - livro: 'Morettin, Estatística Básica: Probabilidade e Inferência'
    exercicios: 'Cap. 9: Exercícios 1, 2, 3, 4 e 5'
    recomendacao: Os exercícios 1 a 3 treinam a distribuição amostral da média; 4 e 5, a da
      proporção. Poucos exercícios, mas todos diretamente relevantes.
  - livro: Bussab & Morettin, Estatística Básica, 9ª ed. — aproximação normal à binomial
    exercicios: 'Cap. 7: Problemas 22, 23 e 24'
    recomendacao: Poucos exercícios dedicados só à aproximação nesta seção. Comparam o cálculo
      binomial exato com a aproximação normal.
  - livro: Montgomery & Runger, Applied Statistics and Probability for Engineers, 7ª ed. — aproximação
      normal à binomial
    exercicios: 'Cap. 4: Exercícios 4.6.1, 4.6.2, 4.6.3, 4.6.4, 4.6.5 e 4.6.6'
    recomendacao: Referência mais completa para a parte de aproximação normal. O exercício 4.6.2
      é o único que aproxima uma Poisson (não uma binomial) pela normal — vale comparar com
      os demais.
  - livro: 'Morettin, Estatística Básica: Probabilidade e Inferência — aproximação normal à
      binomial'
    exercicios: 'Cap. 6: Exercícios 4, 5, 6, 7, 8 e 9'
    recomendacao: Excelente sequência para a parte de aproximação normal — do exercício mais
      simples (4) até aplicações mais ricas (8, com parafusos defeituosos, e 9, com lançamento
      de moeda).
