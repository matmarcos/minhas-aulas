titulo: Aula 22 - Teste de hipótese para a média — variância desconhecida
data: ''
resumo: A estatística T do teste para a média quando σ é desconhecido; região crítica com a tabela t nos casos bilateral
  e unilateral; limites do valor-p pela tabela t e valor exato pelo programa; quando usar Z ou T
bloco: 3
slides:
  titulo: Slides da aula 22
  arquivo: Aula_22_Teste_Hipotese_Media_Var_Desconhecida_SITE.pptx
  arquivo_pdf: Aula_22_Teste_Hipotese_Media_Var_Desconhecida_SITE.pdf
referencias_bibliograficas:
- livro: Bussab & Morettin, Estatística Básica, 9ª ed.
  citacao: Cap. 12 – 12.10
- livro: Montgomery & Runger, Estatística Aplicada e Probabilidade para Engenheiros, 7ª ed.
  citacao: Cap. 9 – 9.3.1
- livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
  citacao: Cap. 8 – 8.3 e 8.4
- livro: 'Morettin, Estatística Básica: Probabilidade e Inferência'
  citacao: Cap. 14 – 14.2 e 14.3
pre_aula:
  leitura:
    itens:
    - Bussab & Morettin, Estatística Básica, 9ª ed. — Seção 12.10 (teste sobre a média de uma normal com variância
      desconhecida).
    - Montgomery & Runger, Estatística Aplicada e Probabilidade para Engenheiros, 7ª ed. — Seção 9.3.1 (testes de
      hipóteses para a média com variância desconhecida; valor P com a tabela t).
    nota: 'As duas referências cobrem o mesmo conteúdo — basta ler uma. O Montgomery escreve "valor P" e chama a
      estatística de T₀; na aula usamos "valor-p" e T. A tabela t da aula dá a área na cauda superior (Aula 17): t₀,₀₅;₉
      é o valor com área 0,05 à sua direita, com 9 graus de liberdade.'
  videos:
  - titulo: 'Teste de hipóteses para a média: variância desconhecida (James Sampaio)'
    url: https://www.youtube.com/watch?v=UrEqmXa8vmQ
  - titulo: Inferência Aula 32 - Teste de Hipótese para Média com Variância Desconhecida (Professor Douglas Maioli)
    url: https://www.youtube.com/watch?v=IxPbPxyUUFA
  tarefa:
  - 'Um alambique de Salinas engarrafa cachaça em garrafas de 700 mL. O volume das garrafas tem distribuição normal, mas o desvio padrão σ é desconhecido. Um fiscal mede 10 garrafas e só autua o alambique se houver evidência de volume médio abaixo do rótulo. A média das 10 garrafas foi x̄ = 696 mL, com desvio padrão amostral s = 6 mL.'
  - '(a) Quais são H₀ e H₁? O teste é unilateral ou bilateral? (Passo 1)'
  - '(b) Qual é a estatística do teste? Por que se usa T, e não Z? Qual a distribuição dela supondo H₀ verdadeira, com quantos graus de liberdade? Com nível de significância α = 5%, qual é a região crítica em T? (Passos 2 e 3)'
  - '(c) Calcule o valor observado t_obs. O fiscal autua o alambique? (Passos 4 e 5)'
  - '(d) Entre quais valores da tabela t fica o valor-p? Como é a evidência contra H₀ na escala de Fisher (Aula 21)? A decisão é a mesma do item (c)?'
  - '(e) Se o fiscal se preocupasse com volume fora de 700 mL para mais ou para menos (teste bilateral), entre quais valores ficaria o valor-p e como fica a evidência na escala de Fisher? A decisão a 5% muda? Confira com o intervalo de confiança de 95% para μ (Aula 18).'
  - 'Trecho da tabela t (área na cauda superior) — ν = 9: 1,383 (0,10) · 1,833 (0,05) · 2,262 (0,025) · 2,821 (0,01) ·
    3,250 (0,005); ν = 10: 1,372 · 1,812 · 2,228 · 2,764 · 3,169. Tarefa opcional, sem entrega e sem nota — serve para
    você conferir se entendeu a leitura. Tente antes de abrir o gabarito.'
  gabarito:
  - titulo: '(a) Passo 1 — hipóteses'
    passos:
    - - 'Hipóteses'
      - 'H₀: μ = 700 (o rótulo está certo) e H₁: μ < 700 (as garrafas têm menos cachaça do que o rótulo).'
    - - 'Unilateral à esquerda'
      - 'garrafa com cachaça a mais não prejudica o consumidor.'
  - titulo: '(b) Passos 2 e 3 — estatística e região crítica'
    passos:
    - - 'Passo 2'
      - 'σ é desconhecido; usa-se S no lugar de σ (Aulas 17 e 18): T = (X̄ − 700)/(S/√n) tem distribuição t com ν = 10 − 1 = 9 graus de liberdade, supondo H₀.'
    - - 'Erro comum'
      - 'usar ν = 10 (a linha certa é n − 1 = 9).'
    - - 'Passo 3'
      - 'α = 5%: linha ν = 9, coluna 0,05 → t₀,₀₅;₉ = 1,833. RC: T < −1,833.'
  - titulo: '(c) Passos 4 e 5 — valor observado e decisão'
    passos:
    - - 'Passo 4'
      - 's/√n = 6/√10 = 1,897 mL; t_obs = (696 − 700)/1,897 = −2,11.'
    - - 'Passo 5'
      - '−2,11 < −1,833: t_obs está na RC → rejeitar H₀. O fiscal autua: há evidência, ao nível de significância α = 5%, de volume médio abaixo de 700 mL.'
  - titulo: '(d) Valor-p pela tabela e escala de Fisher'
    passos:
    - - 'Linha ν = 9'
      - '|t_obs| = 2,11 fica entre 1,833 (coluna 0,05) e 2,262 (coluna 0,025) → unilateral: 0,025 < valor-p < 0,05. Pelo programa, o valor exato é 0,0321.'
    - - 'Escala de Fisher'
      - 'valor-p entre 0,05 e 0,025 → evidência entre moderada e substancial contra H₀.'
    - - 'Comparação com o teste'
      - 'valor-p < 0,05 → rejeitar, a mesma decisão do item (c). A escala mostra que a evidência não é forte: com α = 1%, H₀ não seria rejeitada (0,0321 > 0,01).'
  - titulo: '(e) Bilateral, escala de Fisher e intervalo de confiança'
    passos:
    - - 'Valor-p bilateral'
      - 'dobram-se as áreas → 0,05 < valor-p < 0,10 (exato: 0,0643); como o valor-p > 0,05, não rejeitar H₀ a 5%. A decisão muda: o teste bilateral precisa de uma diferença maior.'
    - - 'Escala de Fisher'
      - 'valor-p entre 0,10 e 0,05 → evidência marginal contra H₀.'
    - - 'IC de 95%'
      - '696 ± 2,262 × 1,897 = 696 ± 4,29 → [691,71 ; 700,29]. O valor de H₀ (700) está dentro do intervalo → não rejeitar H₀ no teste bilateral a 5%, a mesma decisão.'
exercicios_recomendados:
  itens:
  - livro: Bussab & Morettin, Estatística Básica, 9ª ed.
    exercicios: 'Cap. 12: Problemas 21, 22 e 23 (Seção 12.10); Problema Suplementar 25 (b)'
    recomendacao: 'O 21 treina a distribuição t da estatística (probabilidades com a tabela t), sem teste. O 22 (tempo
      dos operários) é unilateral à esquerda: o desvio padrão de 15 minutos é o histórico, de antes da modificação; use
      o s = 12 da amostra. O 23 dá a soma e a soma dos quadrados para calcular s; o item (b) discute o resultado. No
      Suplementar 25, o item (b) refaz o teste do item (a) (Aula 21) sem conhecer σ: compare as duas decisões.'
  - livro: Magalhães & Lima, Noções de Probabilidade e Estatística, 5ª ed.
    exercicios: 'Cap. 8: Exercícios da Seção 8.6, n.º 21, 22, 23 e 24'
    recomendacao: 'O 21 (frequência cardíaca) é bilateral e pede o nível descritivo (o valor-p). O 22 (cabos de aço)
      e o 24 (saneamento) dão os dados brutos: calcule x̄ e s antes do teste. O 23 (crescimento dos bebês) pergunta o
      estimador e sua distribuição e dá uma região crítica pronta para você achar o α.'
  - livro: Montgomery & Runger, Estatística Aplicada e Probabilidade para Engenheiros, 7ª ed.
    exercicios: 'Cap. 9: 9.3.1, 9.3.2, 9.3.3, 9.3.4, 9.3.5, 9.3.6 (a, b, e) e 9.3.7'
    recomendacao: 'Referência mais completa para esta aula. O 9.3.1 treina os valores críticos de t; o 9.3.3 e o
      9.3.5, os limites do valor P pela tabela (como no slide 13 da aula). O 9.3.2 e o 9.3.4 dão uma saída de programa
      com valores faltando. No 9.3.6, os itens (c) e (d) são de potência e tamanho de amostra e ficam de fora; o (b)
      pede para verificar a normalidade. O 9.3.7 pede o teste, o menor nível de significância que rejeita (o valor P) e
      a ligação com o IC.'
  - livro: 'Morettin, Estatística Básica: Probabilidade e Inferência'
    exercicios: 'Cap. 14: Exercícios propostos 1, n.º 6, 7, 9 e 10; Exercícios propostos 2, n.º 1, 3 e 7 (b)'
    recomendacao: 'Nos Exercícios propostos 1, o 6 e o 10 são unilaterais à direita; o 7 e o 9 são bilaterais (com
      α = 10% e α = 2%); o 7 e o 10 trazem os dados brutos. Nos Exercícios propostos 2, o 1 já vem com as hipóteses
      prontas; o 1 e o 3 têm n grande (n = 64 e n = 60), em que t ≈ z (slide 14 da aula); o 7 (b) é unilateral à
      esquerda com os dados brutos (o 7 (a) é IC, Aula 18). O 2 (b) e o 5 também pedem teste, mas com dados agrupados
      ou 36 valores para somar: opcionais.'
  arquivo: Tabela_Referencias_Aula22.pdf
lista_ia:
  lista_arquivo: Lista_Aula22_Original.pdf
  gabarito_arquivo: Gabarito_Aula22_Original.pdf
material_complementar:
  texto:
  - Para as contas, use a sua tabela t (Aula 17), com a área na cauda superior. A tabela só dá os limites do valor-p;
    programas estatísticos e planilhas calculam o valor exato.
