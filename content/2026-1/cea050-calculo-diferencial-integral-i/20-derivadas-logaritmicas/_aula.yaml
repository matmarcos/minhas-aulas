titulo: Aula 20 - Derivadas de funções logarítmicas
bloco: 2
data: ''
resumo: Derivada de ln(x) e de log_a(x); combinação com a regra da cadeia; o número e como limite
descricao:
- 'Sabendo que a exponencial e o logaritmo são funções inversas, a derivada do logaritmo sai da regra
  de derivação da inversa vista na aula anterior. O resultado é notavelmente simples: a derivada de ln(x)
  é 1/x. Para outras bases aparece um fator de correção, e a derivada de log_a(x) é 1/(x·ln a) — mais
  uma vantagem prática da base e, que faz esse fator valer 1.'
- 'Combinando com a Regra da Cadeia, obtém-se a forma usada na maioria dos exercícios: a derivada de ln(g(x))
  é g′(x)/g(x). Derivar ln(x³ + 1), por exemplo, é imediato por essa fórmula. Vale sempre verificar o
  domínio antes de derivar, já que o logaritmo exige argumento positivo.'
- 'A aula termina com uma releitura do número e: partindo de que a derivada de ln(x) em x = 1 vale 1 e
  aplicando a definição de derivada, chega-se a e como o limite de (1 + x)^(1/x) quando x tende a zero.
  É uma caracterização diferente daquela dada na aula 9 e fecha a construção das funções transcendentes
  elementares — todas já podem ser derivadas.'
referencias_bibliograficas:
- livro: Stewart, Cálculo, Volume I, 6ª ed.
  citacao: Cap. 3 — 3.6
- livro: Thomas, Cálculo, Volume 1, 12ª ed.
  citacao: Cap. 3 — 3.8
