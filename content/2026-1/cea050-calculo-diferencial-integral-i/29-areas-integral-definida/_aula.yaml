titulo: Aula 29 - Áreas e distâncias; a integral definida
bloco: 3
data: ''
resumo: Problema da área; aproximação por retângulos; somas de Riemann; definição e propriedades da integral
  definida
descricao:
- 'A segunda grande ideia do Cálculo começa com um problema geométrico: calcular a área de uma região
  sob uma curva. Para regiões de lados retos a geometria elementar basta; para lados curvos, não há fórmula.
  A estratégia é a mesma que produziu o limite na aula 11 — aproximar e refinar.'
- Aproxima-se a região por retângulos cujas alturas são valores da função, soma-se suas áreas e observa-se
  o que acontece quando o número de retângulos cresce. Com poucos retângulos a aproximação é grosseira;
  aumentando a quantidade, o erro diminui. Essas somas recebem o nome de somas de Riemann, e a integral
  definida de a até b é definida como o limite delas quando o número de subdivisões tende ao infinito.
- 'Da definição saem as propriedades operatórias: linearidade, aditividade em relação ao intervalo e inversão
  de sinal ao trocar os limites de integração. Uma consequência importante da definição por somas com
  sinal: quando f assume valores negativos, a integral não é a área, e sim a diferença entre a área acima
  e a área abaixo do eixo x. Calcular a área da região entre f(x) = 9 − x² e o eixo x, como pediu a P3,
  exige atenção a esse detalhe ao determinar os limites de integração.'
