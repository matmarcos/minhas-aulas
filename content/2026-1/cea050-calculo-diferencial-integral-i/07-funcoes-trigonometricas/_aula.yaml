titulo: Aula 07 - Funções trigonométricas
bloco: 1
data: ''
resumo: Gráficos de seno e cosseno; domínio, imagem, zeros e periodicidade; função tangente
descricao:
- 'As funções trigonométricas são apresentadas aqui no contexto do Cálculo, o que significa uma mudança
  importante em relação ao ensino médio: o argumento é sempre medido em radianos. Essa convenção não é
  arbitrária — as fórmulas de derivada de seno e cosseno só assumem a forma simples que veremos no bloco
  2 se o ângulo estiver em radianos.'
- 'Seno e cosseno têm domínio igual a todos os reais e imagem no intervalo [−1, 1]. Ambas são periódicas
  de período 2π, o que significa que basta entender o comportamento em um intervalo de comprimento 2π
  para conhecer a função inteira. Os zeros seguem padrões regulares: o seno se anula nos múltiplos inteiros
  de π, o cosseno nos múltiplos ímpares de π/2.'
- A tangente é definida como o quociente do seno pelo cosseno, e por isso não está definida onde o cosseno
  se anula — nesses pontos aparecem assíntotas verticais. Seu período é π, não 2π, uma diferença que costuma
  passar despercebida. As demais funções trigonométricas (secante, cossecante e cotangente) são definidas
  como recíprocas e herdam as restrições de domínio correspondentes.
referencias_bibliograficas:
