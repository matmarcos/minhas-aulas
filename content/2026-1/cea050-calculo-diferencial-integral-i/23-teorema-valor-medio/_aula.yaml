titulo: Aula 23 - O Teorema do Valor Médio
bloco: 3
data: ''
resumo: Teorema de Rolle; Teorema do Valor Médio; consequências sobre funções com a mesma derivada
descricao:
- 'Esta aula estabelece o resultado teórico que sustenta boa parte do que vem depois. Começa pelo Teorema
  de Rolle: se f é contínua em [a, b], derivável em (a, b) e assume o mesmo valor nas duas extremidades,
  então existe pelo menos um ponto c no interior onde f′(c) = 0. Geometricamente é evidente — se a curva
  sai de uma altura e volta à mesma altura, em algum lugar ela teve de parar de subir e começar a descer,
  e ali a tangente é horizontal.'
- 'O Teorema do Valor Médio generaliza Rolle dispensando a exigência de que f(a) = f(b). Ele garante a
  existência de um ponto c em (a, b) onde f′(c) é igual a [f(b) − f(a)]/(b − a), ou seja, onde a taxa
  de variação instantânea coincide com a taxa de variação média no intervalo. A leitura física é a mais
  memorável: se um carro percorreu 160 km em 2 horas, sua velocidade média foi 80 km/h, e o teorema afirma
  que em algum instante o velocímetro marcou exatamente 80. Note que as três hipóteses — continuidade
  no fechado, derivabilidade no aberto e o intervalo ser limitado — são todas necessárias.'
- 'As consequências é que tornam o teorema indispensável. Se f′(x) = 0 em todo um intervalo, então f é
  constante nesse intervalo. E se duas funções têm a mesma derivada, elas diferem por uma constante —
  que é exatamente a justificativa formal para o ''+ C'' que aparecerá nas primitivas. O Teorema do Valor
  Médio também é o que demonstra o Teste Crescente/Decrescente da próxima aula: sem ele, a afirmação de
  que derivada positiva implica função crescente seria apenas uma observação gráfica plausível, não um
  resultado provado.'
