titulo: Aula 25 - Concavidade, pontos de inflexão e teste da segunda derivada
bloco: 3
data: ''
resumo: Concavidade para cima e para baixo; teste da concavidade; pontos de inflexão; teste da segunda
  derivada
descricao:
- 'A primeira derivada diz se a curva sobe ou desce; a segunda diz de que modo ela se curva. Uma função
  é côncava para cima em um intervalo quando seu gráfico fica acima de todas as suas retas tangentes,
  e côncava para baixo quando fica abaixo. Uma imagem útil: côncava para cima segura água, côncava para
  baixo a derrama.'
- 'O Teste da Concavidade converte isso em conta: onde f″(x) > 0 a concavidade é para cima; onde f″(x)
  < 0 é para baixo. Os pontos em que a concavidade muda de sentido são os pontos de inflexão. Aqui cabe
  a mesma ressalva do Teorema de Fermat: f″(c) = 0 não garante inflexão em c — é preciso verificar que
  o sinal de f″ efetivamente mudou ao atravessar o ponto.'
- A segunda derivada oferece ainda um caminho alternativo para classificar extremos. Pelo Teste da Segunda
  Derivada, se f′(c) = 0 e f″(c) > 0, então c é mínimo local; se f″(c) < 0, é máximo local. Quando f″(c)
  = 0 o teste é inconclusivo e é preciso voltar ao teste da primeira derivada. Reunindo crescimento, concavidade
  e inflexão, chega-se ao esboço completo da curva — o que a parte (b) da segunda questão e a última questão
  da P3 cobraram.
referencias_bibliograficas:
- livro: Stewart, Cálculo, Volume I, 6ª ed.
  citacao: Cap. 4 — 4.3
- livro: Thomas, Cálculo, Volume 1, 12ª ed.
  citacao: Cap. 4 — 4.4
