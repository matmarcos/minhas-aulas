titulo: 'Aula 24 - Como as derivadas afetam a forma de um gráfico: crescimento e teste da primeira derivada'
bloco: 3
data: ''
resumo: Teste crescente/decrescente; análise do sinal de f′; teste da primeira derivada
descricao:
- 'Aqui a derivada deixa de ser uma conta e vira instrumento de leitura de gráficos. O Teste Crescente/Decrescente
  é direto: onde f′(x) > 0 a função é crescente; onde f′(x) < 0 é decrescente. A justificativa é geométrica
  — inclinação positiva da tangente significa curva subindo.'
- O procedimento prático consiste em achar os números críticos, usá-los para dividir a reta real em intervalos,
  determinar o sinal de f′ em cada intervalo e montar uma tabela. A tabela é o que organiza a informação
  e evita erro de sinal; vale construí-la sempre, mesmo em exercícios simples.
- 'Com o quadro de sinais pronto, o Teste da Primeira Derivada classifica cada número crítico pela mudança
  de sinal de f′ ao atravessá-lo: de positivo para negativo indica máximo local; de negativo para positivo
  indica mínimo local; sem mudança de sinal, não há extremo — é o caso de x³ na origem. Este teste responde
  à parte (a) da segunda questão da P3, que pedia intervalos de crescimento e classificação dos extremos
  de h(x) = x³ − 6x² + 9x − 1.'
referencias_bibliograficas:
- livro: Stewart, Cálculo, Volume I, 6ª ed.
  citacao: Cap. 4 — 4.3
- livro: Demana et al., Pré-cálculo
  citacao: Cap. 7 (funções crescentes e decrescentes)
- livro: Thomas, Cálculo, Volume 1, 12ª ed.
  citacao: Cap. 4 — 4.3
exercicios_recomendados:
  itens:
  - livro: Stewart, Cálculo, Volume I, 6ª ed.
    exercicios: 'Seção 4.3: exercícios 1, 3, 4, 9, 11, 25, 27, 33, 41 e 45'
    recomendacao: Lista da Seção 4.3, compartilhada com a aula 24. Para esta, priorize os que pedem intervalos
      de crescimento e classificação de extremos pelo teste da primeira derivada.
