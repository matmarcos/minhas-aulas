titulo: Aula 26 - Formas indeterminadas e a Regra de L'Hôspital
bloco: 3
data: ''
resumo: Indeterminações 0/0 e ∞/∞; enunciado e aplicação da Regra de L'Hôspital; forma 0·∞
descricao:
- No bloco 2 as indeterminações 0/0 eram resolvidas por fatoração ou racionalização — técnicas que dependem
  da expressão ter uma forma algébrica conveniente. Limites como (1 − cos x)/x² não cedem a nenhuma delas.
  A Regra de L'Hôspital resolve o caso geral usando derivadas.
- 'O enunciado: se o limite de f(x)/g(x) produz a indeterminação 0/0 ou ∞/∞, então esse limite é igual
  ao limite de f′(x)/g′(x), desde que este último exista. O erro mais frequente é aplicar a regra derivando
  o quociente — não se usa a regra do quociente aqui; deriva-se numerador e denominador separadamente.
  O segundo erro é aplicá-la sem antes verificar que há de fato indeterminação: se a substituição direta
  já dá um número, a regra não vale e produz resultado errado.'
- A regra pode ser aplicada repetidamente enquanto a indeterminação persistir — o limite da questão 3
  da P3 exige duas aplicações e resulta em 1/2. Ela vale também para limites laterais e para limites no
  infinito. E indeterminações de outros tipos, como 0·∞, podem ser convertidas para 0/0 ou ∞/∞ reescrevendo
  o produto como quociente, o que as traz para o alcance da regra.
