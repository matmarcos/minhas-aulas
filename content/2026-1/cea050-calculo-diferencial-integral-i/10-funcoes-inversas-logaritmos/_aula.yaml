titulo: Aula 10 - Funções inversas e logaritmos
bloco: 1
data: ''
resumo: Função injetora e teste da reta horizontal; função inversa; funções logarítmicas; propriedades
  e mudança de base
descricao:
- 'Nem toda função tem inversa. A condição é ser injetora — nunca assumir o mesmo valor duas vezes — e
  o critério gráfico correspondente é o teste da reta horizontal: nenhuma reta horizontal pode cortar
  o gráfico em mais de um ponto. Note o paralelo com o teste da reta vertical da aula 5: um decide se
  a curva é função, o outro se essa função é inversível.'
- 'A inversa f⁻¹ desfaz o que f faz, trocando os papéis de domínio e imagem. Na prática, obtém-se a inversa
  escrevendo y = f(x), isolando x em função de y e trocando os nomes das variáveis. Graficamente, o gráfico
  de f⁻¹ é a reflexão do gráfico de f em relação à reta y = x. Vale a atenção ao domínio: encontrar a
  inversa de 1/(1 − eˣ), como caiu na P1, exige antes identificar onde a função original está definida.'
- 'As funções logarítmicas são, por definição, as inversas das exponenciais: log_a(x) = y significa exatamente
  a^y = x. Daí seguem as propriedades operatórias — logaritmo do produto vira soma, do quociente vira
  diferença, do expoente vira multiplicação — e a fórmula de mudança de base. O logaritmo de base e recebe
  notação própria, ln(x), e as identidades ln(eˣ) = x e e^ln(x) = x são as ferramentas para resolver equações
  exponenciais e logarítmicas.'
referencias_bibliograficas:
