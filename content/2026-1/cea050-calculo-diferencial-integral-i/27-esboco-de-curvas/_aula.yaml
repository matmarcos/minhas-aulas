titulo: Aula 27 - Resumo do esboço de curvas
bloco: 3
data: ''
resumo: 'Roteiro completo de esboço: domínio, interseções, simetria, assíntotas, crescimento, extremos,
  concavidade e inflexão'
descricao:
- Esta é a aula de síntese do bloco. Em vez de introduzir um conceito novo, ela organiza tudo que foi
  visto sobre derivadas em um roteiro único para esboçar o gráfico de uma função sem depender de calculadora
  ou de tabela de valores.
- O roteiro tem oito etapas, e cada uma reaproveita uma aula anterior. Determinar o domínio; encontrar
  as interseções com os eixos; verificar simetria (par, ímpar ou periódica); localizar as assíntotas verticais,
  horizontais e, quando houver, oblíquas; achar os intervalos de crescimento e decrescimento pelo sinal
  de f′; classificar os máximos e mínimos locais; determinar concavidade e pontos de inflexão pelo sinal
  de f″; e só então desenhar a curva reunindo todas essas informações.
- 'O valor do roteiro está na ordem e na conferência cruzada: as etapas se confirmam mutuamente, e uma
  incoerência entre elas — um trecho marcado como crescente que teria de descer para respeitar uma assíntota,
  por exemplo — sinaliza erro de conta em algum passo anterior. A operação inversa também é cobrada: dadas
  condições sobre limites, crescimento e concavidade, esboçar uma função contínua que as satisfaça simultaneamente.
  Foi exatamente isso que a última questão da P3 pediu, e ela se resolve traduzindo cada condição em um
  traço do desenho, uma de cada vez.'
referencias_bibliograficas:
- livro: Stewart, Cálculo, Volume I, 6ª ed.
  citacao: Cap. 4 — 4.5
- livro: Thomas, Cálculo, Volume 1, 12ª ed.
  citacao: Cap. 4 — 4.4
