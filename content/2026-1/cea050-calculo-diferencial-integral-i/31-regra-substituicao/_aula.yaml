titulo: Aula 31 - Integrais indefinidas e a Regra da Substituição
bloco: 3
data: ''
resumo: Notação de integral indefinida; integral definida versus indefinida; Regra da Substituição
descricao:
- 'A notação de integral indefinida representa a família de primitivas de f, sempre acompanhada da constante
  C. Convém não confundir os dois objetos: a integral definida de a até b é um número, enquanto a integral
  indefinida é uma família de funções. A tabela de integrais indefinidas é a tabela de primitivas da aula
  28, reescrita nessa notação.'
- A Regra da Substituição é a Regra da Cadeia lida ao contrário. Quando o integrando contém uma função
  composta multiplicada pela derivada do miolo, define-se u como esse miolo, calcula-se du e a integral
  se transforma em outra, mais simples, na variável u. Escolher o u certo é a única decisão do método,
  e o critério prático é procurar a expressão cuja derivada também aparece no integrando, a menos de constante.
- 'Para integrais definidas há dois caminhos: voltar à variável original antes de avaliar nos limites,
  ou — mais eficiente — converter também os limites de integração para a variável u e avaliar diretamente.
  Esquecer de converter os limites ao usar o segundo caminho é o erro clássico da seção. A técnica amplia
  bastante o repertório: integrais como a da tangente, obtida escrevendo-a como quociente de seno por
  cosseno e substituindo u = cos x, tornam-se acessíveis.'
