titulo: Aula 23 - Matriz de uma transformação
bloco: 3
data: ''
resumo: Matriz associada a uma transformação linear em relação a bases
descricao:
- 'Toda transformação linear T:ℝᵐ→ℝⁿ pode ser representada por uma matriz de ordem n×m que reproduz exatamente
  a ação de T sobre os elementos de ℝᵐ. Em geral essa matriz depende das bases escolhidas em ℝᵐ e ℝⁿ,
  mas o curso opta por uma simplificação deliberada: usar sempre as bases canônicas, com ênfase em ℝ²
  e ℝ³ — a matriz de T é então formada colocando T(e₁), T(e₂), …, T(eₘ) como colunas.'
- 'Essa correspondência funciona nos dois sentidos: dada a fórmula de T, obtém-se a matriz calculando
  a imagem de cada vetor da base canônica; e, inversamente, dada uma matriz [S], obtém-se a lei que define
  a transformação associada S(x,y,z) multiplicando a matriz pelo vetor (x,y,z) — o produto matriz-vetor
  da aula 2 reaparece aqui como o mecanismo que converte uma matriz de volta em fórmula.'
- 'Essa dualidade entre transformação e matriz é o que permite, daqui em diante, tratar problemas sobre
  transformações lineares como problemas sobre matrizes — e vice-versa: compor duas transformações lineares
  corresponde a multiplicar suas matrizes, na mesma ordem; e encontrar a transformação inversa de uma
  T invertível corresponde a calcular a matriz inversa, já dominada desde a aula 7.'
