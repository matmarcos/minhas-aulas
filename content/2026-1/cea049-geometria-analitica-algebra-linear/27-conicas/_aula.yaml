material_complementar:
  texto:
  - 'Trabalho avaliativo em grupo: cada grupo (até 4 integrantes) sorteia uma cônica — elipse, hipérbole
    ou parábola, sem rotação ou translação — e apresenta em slides, com duração ideal de 15 minutos.'
  - 'A apresentação precisa cobrir: a definição geométrica da cônica sorteada; exemplos de equações na
    forma padrão; um esboço da cônica; e os elementos específicos — para todas, focos, vértices, eixos
    e excentricidade; para a hipérbole, também as assíntotas; para a parábola, também a diretriz.'
  - 'Critérios de avaliação: domínio do conteúdo (clareza e correção nas explicações), apresentação oral
    (postura e organização do grupo), qualidade dos slides e cumprimento do tempo estipulado.'
