titulo: Aula 11 - Produto escalar e projeção I
bloco: 2
data: ''
resumo: Norma de um vetor; produto escalar (interno); ângulo entre vetores
descricao:
- 'A norma de um vetor generaliza a ideia de comprimento: se V=(x,y), ‖V‖=√(x²+y²), e a fórmula ganha
  mais um termo para vetores no espaço. A distância entre dois pontos P e Q é definida como a norma do
  vetor que liga um ao outro, dist(P,Q)=‖PQ‖ — a fórmula da distância entre pontos, vista em geometria
  analítica plana, é um caso particular dessa definição.'
- Um vetor é dito unitário quando ‖V‖=1, e o versor de um vetor V não nulo é o vetor unitário na mesma
  direção e sentido, obtido dividindo V pela sua própria norma. Versores aparecem sempre que se precisa
  de uma direção sem se importar com a escala — por exemplo, ao definir vetores normais a um plano, mais
  adiante no curso.
- O produto escalar (ou interno) de dois vetores U e V é definido por U·V = ‖U‖‖V‖cos(θ), onde θ é o ângulo
  entre eles — e vale zero se um dos vetores for nulo. Em coordenadas, para U=(x,y) e V=(a,b), essa definição
  geométrica se traduz em U·V=ax+by (a chamada lei dos cossenos). O produto escalar permite calcular o
  ângulo entre vetores sem medir nada — cos(θ) = (U·V)/(‖U‖‖V‖) — e o sinal do produto escalar já revela
  se o ângulo é agudo, reto ou obtuso, sem precisar calcular o cosseno explicitamente.
