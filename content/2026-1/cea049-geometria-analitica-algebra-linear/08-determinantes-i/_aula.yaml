titulo: Aula 08 - Determinantes I
bloco: 1
data: ''
resumo: Definição de determinante por expansão em cofatores; menor complementar e cofator
descricao:
- O determinante é um número associado a cada matriz quadrada que resume, entre outras coisas, se ela
  é invertível. A definição formal usa permutações, mas o curso opta por não desenvolvê-la — o foco é
  nas técnicas de cálculo. Para matrizes 2×2 e 3×3, a Regra de Sarrus dá uma fórmula direta.
- Para matrizes maiores, usa-se expansão em cofatores. O cofator do elemento aᵢⱼ é Aᵢⱼ = (−1)^(i+j)Dᵢⱼ,
  onde Dᵢⱼ é o determinante da matriz menor obtida ao remover a linha i e a coluna j de A. O determinante
  de A pode então ser calculado por desenvolvimento por linha ou por coluna qualquer — somando os produtos
  aᵢⱼAᵢⱼ ao longo dessa linha ou coluna — e o resultado é o mesmo não importa qual linha ou coluna se
  escolha.
- 'Uma leitura vale a pena além do que foi apresentado em aula: o Exemplo 2.11 do livro-texto trata do
  determinante de matrizes triangulares, que é simplesmente o produto dos elementos da diagonal — um atalho
  que economiza tempo sempre que a matriz já estiver (ou puder ser levada, sem trocar o valor do determinante)
  à forma triangular.'
