titulo: Aula 24 - Transformações no plano
bloco: 3
data: ''
resumo: Reflexão, projeção, rotação, contração e dilatação no plano
descricao:
- Com a correspondência transformação-matriz estabelecida na aula anterior, esta aula cataloga os operadores
  lineares (transformações T:ℝⁿ→ℝⁿ, com domínio e contradomínio iguais) que têm interpretação geométrica
  direta no plano. A reflexão em torno do eixo x tem matriz diag(1,−1); em torno do eixo y, diag(−1,1);
  e em torno da reta y=x, a matriz que troca as coordenadas, [[0,1],[1,0]].
- 'A projeção ortogonal sobre o eixo x tem matriz diag(1,0) — zera a segunda coordenada e mantém a primeira;
  sobre o eixo y, o inverso. Contração e dilatação são ambas da forma diag(a,a): contração quando 0<a<1
  (encolhe o vetor mantendo a direção) e dilatação quando a>1 (amplia). A rotação pelo ângulo θ tem a
  matriz mais elaborada do grupo, com senos e cossenos de θ nas quatro entradas, e é a única desse catálogo
  cujo efeito não é imediatamente visível olhando só para a matriz — precisa da fórmula trigonométrica.'
- 'O mesmo catálogo se estende ao espaço tridimensional: reflexões nos três planos coordenados (xy, xz,
  yz) e projeções ortogonais sobre esses mesmos planos, cada uma com sua matriz diagonal característica.
  Como composição de transformações lineares corresponde a multiplicação de matrizes (aula 23), aplicar
  duas transformações em sequência — por exemplo, uma reflexão seguida de uma dilatação — equivale a multiplicar
  as duas matrizes na ordem correta e aplicar o resultado de uma vez.'
