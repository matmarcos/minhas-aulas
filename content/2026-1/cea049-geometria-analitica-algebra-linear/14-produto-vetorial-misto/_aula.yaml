titulo: Aula 14 - Produto vetorial e produto misto
bloco: 2
data: ''
resumo: Aplicações do produto vetorial; produto misto e interpretação geométrica (volume)
descricao:
- O produto misto de três vetores U, V e W, denotado [U,V,W], é definido como U·(V×W) — um produto escalar
  aplicado ao resultado de um produto vetorial — e se calcula diretamente como o determinante 3×3 formado
  pelas componentes dos três vetores em linha.
- 'Sua interpretação geométrica é análoga à do produto vetorial, mas uma dimensão acima: o produto misto
  vale zero exatamente quando os três vetores são coplanares (ou quando algum é nulo, ou dois são colineares);
  e, quando não é zero, seu módulo é o volume do paralelepípedo com arestas U, V e W. O volume do tetraedro
  com essas mesmas arestas é um sexto desse valor.'
- O produto misto fecha o repertório de ferramentas vetoriais do bloco 2 e é o que permite, por exemplo,
  verificar rapidamente se quatro pontos no espaço são coplanares (calculando o produto misto de três
  vetores formados a partir deles) — um teste que aparece com frequência nos exercícios de revisão do
  capítulo e prepara o terreno para as equações de plano da aula seguinte.
