titulo: Aula 15 - Equações do plano I
bloco: 2
data: ''
resumo: Equação geral do plano; vetor normal; plano determinado por três pontos
descricao:
- 'Assim como uma reta no plano tem uma equação geral ax+by+c=0, um plano no espaço tem uma equação geral
  ax+by+cz+d=0. A construção parte de um vetor normal N — um vetor ortogonal a todos os vetores contidos
  no plano — e de um ponto P conhecido do plano: para qualquer outro ponto X do plano, o vetor PX é ortogonal
  a N, ou seja, PX·N=0. Expandindo esse produto escalar em coordenadas, chega-se diretamente à equação
  geral.'
- Na prática, obter a equação de um plano é encontrar um vetor normal e um ponto. Quando o plano é dado
  por dois vetores paralelos a ele (não colineares) e um ponto, o vetor normal sai do produto vetorial
  desses dois vetores — a aula 13 comparece aqui como pré-requisito direto. Quando o plano é dado por
  três pontos não colineares, dois vetores formados a partir deles (por exemplo, PQ e PR) servem de vetores
  diretores, e o mesmo procedimento se aplica.
- 'A aula termina com o caminho inverso: dada a equação geral de um plano, encontrar pontos que pertencem
  a ele — basta atribuir valores livres a duas das três variáveis e resolver a equação para a terceira.
  Esse vaivém entre equação e pontos concretos é a habilidade central que a aula 16 aprofunda com as equações
  vetorial e paramétricas do plano.'
