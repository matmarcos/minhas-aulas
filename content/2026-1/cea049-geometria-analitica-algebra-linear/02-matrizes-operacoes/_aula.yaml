titulo: 'Aula 02 - Matrizes: operações'
bloco: 1
data: ''
resumo: Adição, multiplicação por escalar, multiplicação de matrizes e transposta
descricao:
- Definidas as matrizes, a aula passa às quatro operações que as tornam uma álgebra. A soma de duas matrizes
  de mesma ordem é feita entrada a entrada; a multiplicação por escalar também — multiplica-se cada elemento
  pelo número λ.
- 'A multiplicação de matrizes é a operação que exige mais cuidado: para multiplicar A (m×n) por B (n×p),
  o número de colunas de A precisa coincidir com o número de linhas de B, e o resultado é uma matriz m×p
  cujo elemento cᵢⱼ é a soma dos produtos aᵢₖbₖⱼ ao longo de k. Diferente da soma, a multiplicação de
  matrizes não é comutativa — AB e BA geralmente não coincidem, e às vezes nem os dois produtos existem.'
- 'A transposta encerra o quarteto: a transposta de uma matriz A (m×n) é a matriz Aᵀ (n×m) obtida trocando
  linhas por colunas, bᵢⱼ = aⱼᵢ. Ela satisfaz quatro propriedades operatórias que serão citadas sem prova
  mais adiante — (A+B)ᵀ = Aᵀ+Bᵀ, (λA)ᵀ = λAᵀ, (Aᵀ)ᵀ = A e (AB)ᵀ = BᵀAᵀ, esta última com a ordem invertida,
  um detalhe que vale memorizar.'
