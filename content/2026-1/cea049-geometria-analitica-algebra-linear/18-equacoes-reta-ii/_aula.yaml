titulo: Aula 18 - Equações da reta II
bloco: 2
data: ''
resumo: Equação simétrica da reta; ângulos e distâncias entre retas e planos
descricao:
- 'Quando as três componentes a, b, c do vetor diretor de uma reta são todas não nulas, é possível isolar
  o parâmetro t nas três equações paramétricas e igualá-las, obtendo a equação simétrica da reta: (x−x₁)/a
  = (y−y₁)/b = (z−z₁)/c. É uma forma compacta, útil sobretudo para ler rapidamente o vetor diretor e um
  ponto da reta direto da equação, sem precisar isolar nada.'
- A segunda metade da aula trata de posições relativas. O ângulo entre duas retas é definido como o menor
  ângulo entre seus vetores diretores — calculado, como sempre, via produto escalar. Duas retas são paralelas
  quando os vetores diretores são paralelos (um é múltiplo escalar do outro) e são ortogonais quando os
  vetores diretores são ortogonais entre si (produto escalar nulo).
- 'O mesmo raciocínio se estende a planos: o ângulo entre dois planos π₁ e π₂ é definido como o ângulo
  entre seus vetores normais N₁ e N₂, com cos(π₁,π₂) = (N₁·N₂)/(‖N₁‖‖N₂‖). Essa aula fecha o bloco de
  geometria analítica reunindo retas e planos sob o mesmo tipo de ferramenta — ângulos e posições relativas
  sempre reduzidos a um produto escalar entre vetores diretores ou normais.'
