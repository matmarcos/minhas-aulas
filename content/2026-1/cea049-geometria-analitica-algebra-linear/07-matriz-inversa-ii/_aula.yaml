titulo: Aula 07 - Matriz inversa II
bloco: 1
data: ''
resumo: Cálculo da inversa por escalonamento; matrizes elementares
descricao:
- Com a definição de inversa estabelecida na aula anterior, esta aula ensina como efetivamente calculá-la.
  O método consiste em colocar a matriz A ao lado da identidade, formando [A|I], e aplicar o método de
  Gauss-Jordan (aula 4) a esse bloco até que o lado esquerdo se torne a identidade — nesse ponto, o lado
  direito é A⁻¹.
- 'O método também serve como teste de invertibilidade na prática: se, ao aplicar Gauss-Jordan, alguma
  linha do lado esquerdo se anula por completo antes de chegar à identidade, a matriz não é invertível.
  Uma aplicação direta e importante é a resolução de sistemas: se A é invertível, o sistema AX=b tem solução
  única X=A⁻¹b; e um sistema homogêneo AX=0 tem solução não trivial se, e somente se, A não é invertível
  — uma antecipação do critério via determinante que vem no bloco seguinte.'
- 'A aula ainda toca em duas aplicações opcionais da inversão de matrizes que aparecem no livro-texto,
  mas não são cobradas em prova: interpolação polinomial (encontrar o polinômio que passa por um conjunto
  de pontos, resolvendo um sistema linear para os coeficientes) e criptografia (usar uma matriz invertível
  para codificar e decodificar mensagens).'
