titulo: 'Aula 04 - Sistemas de equações lineares: Gauss-Jordan'
bloco: 1
data: ''
resumo: Sistemas lineares; forma escalonada reduzida; método de eliminação de Gauss-Jordan
descricao:
- 'Um sistema de equações lineares é um conjunto de equações da forma a₁x₁+a₂x₂+⋯+aₙxₙ=b, e toda a teoria
  de matrizes da aula 1 existe, em boa parte, para representá-lo de forma compacta: o sistema AX=b, onde
  A reúne os coeficientes, X as incógnitas e b os termos independentes. Colocando A ao lado de b obtém-se
  a matriz ampliada [A|b], o objeto que de fato se manipula ao resolver o sistema.'
- 'Resolver um sistema por eliminação consiste em aplicar operações elementares às linhas da matriz ampliada
  — permutar duas linhas, multiplicar uma linha por uma constante não nula, ou somar a uma linha um múltiplo
  de outra — sem alterar o conjunto solução. O objetivo é chegar a uma matriz na forma escalonada reduzida:
  linhas nulas por último, pivô igual a 1 em cada linha não nula, cada pivô à direita do pivô anterior,
  e zeros acima e abaixo de cada pivô.'
- 'O método de Gauss-Jordan é o algoritmo passo a passo para chegar a essa forma: localizar a coluna mais
  à esquerda não nula, obter um pivô igual a 1 nela, zerar o restante da coluna, e repetir o processo
  ignorando a linha já tratada. Uma vez na forma escalonada reduzida, a solução do sistema é lida diretamente
  da matriz, sem precisar de retrossubstituição — a aula seguinte é dedicada a praticar exatamente esse
  algoritmo em vários sistemas.'
