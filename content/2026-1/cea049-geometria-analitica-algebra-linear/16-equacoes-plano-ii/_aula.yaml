titulo: Aula 16 - Equações do plano II
bloco: 2
data: ''
resumo: Equações paramétricas e vetorial do plano
descricao:
- 'Um plano π que contém um ponto P e dois vetores não colineares U e V pode ser descrito de outra forma:
  qualquer ponto X do plano se escreve como X = P + αU + βV, para escalares α e β reais — a equação vetorial
  do plano. Ao contrário da equação geral (uma única equação em x, y, z), a equação vetorial descreve
  o plano como o conjunto de todas as combinações lineares de U e V, deslocado até P.'
- 'Escrevendo essa equação vetorial coordenada a coordenada, obtêm-se as equações paramétricas do plano:
  um sistema de três equações, cada uma expressando x, y ou z em função dos parâmetros livres α e β. É
  uma forma particularmente útil quando se quer gerar pontos do plano diretamente, sem resolver equação
  nenhuma — basta escolher valores para α e β.'
- 'Passar de uma forma para outra é uma habilidade prática que a aula pratica em ambos os sentidos: da
  equação vetorial/paramétrica para a equação geral (eliminando os parâmetros α e β do sistema) e da equação
  geral de volta para a paramétrica (encontrando dois vetores diretores e um ponto que satisfazem a equação
  dada).'
