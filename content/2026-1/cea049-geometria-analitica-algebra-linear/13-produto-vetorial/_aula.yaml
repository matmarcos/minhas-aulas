titulo: Aula 13 - Produto vetorial
bloco: 2
data: ''
resumo: Definição, propriedades e interpretação geométrica do produto vetorial (área)
descricao:
- 'Diferente do produto escalar, que devolve um número, o produto vetorial V×W de dois vetores em ℝ³ devolve
  um vetor com três características: comprimento ‖V‖‖W‖sen(θ), numericamente igual à área do paralelogramo
  determinado por V e W; direção perpendicular tanto a V quanto a W; e sentido dado pela regra da mão
  direita.'
- O cálculo prático usa um determinante simbólico 3×3, com a primeira linha formada pelos vetores da base
  canônica (i, j, k) e as outras duas pelas componentes de V e W. Entre as propriedades, a mais usada
  é a anticomutatividade, V×W = −(W×V) — a ordem dos vetores importa, e trocá-la inverte o sentido do
  resultado.
- 'A interpretação geométrica como área é a aplicação mais imediata: a área de um triângulo com vértices
  P, Q, R é metade da norma do produto vetorial de dois de seus lados, uma fórmula muito mais direta que
  decompor o triângulo em base e altura quando os pontos são dados por coordenadas no espaço.'
