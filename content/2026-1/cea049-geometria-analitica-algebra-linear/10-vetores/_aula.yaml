titulo: Aula 10 - Vetores
bloco: 2
data: ''
resumo: 'Vetores no plano e no espaço: definição geométrica, soma e multiplicação por escalar; componentes'
descricao:
- 'O segundo bloco muda de assunto — de sistemas e matrizes para álgebra vetorial — e começa pela definição
  geométrica de vetor: a classe de equivalência de todos os segmentos orientados com a mesma direção,
  o mesmo comprimento e o mesmo sentido. Um vetor não é um segmento específico, é o que vários segmentos
  diferentes têm em comum.'
- A soma de vetores é definida pela regra do paralelogramo (ou do triângulo), e satisfaz as propriedades
  familiares da adição — comutatividade, associatividade, existência do vetor nulo e do vetor simétrico
  (oposto). A multiplicação por escalar α redimensiona o vetor por |α| e inverte o sentido quando α é
  negativo, mantendo a mesma direção.
- 'A parte final da aula traduz essa geometria em números: identificando cada ponto do plano com um vetor
  a partir da origem, obtém-se a representação por coordenadas V=(x,y), com operações componente a componente
  (soma, multiplicação por escalar, igualdade). O mesmo esquema, com uma coordenada a mais, estende-se
  para vetores no espaço tridimensional, V=(x,y,z) — extensão natural que a aula 11 explora em detalhe
  antes de seguir para norma e produto escalar.'
